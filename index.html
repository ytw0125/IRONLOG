<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IRONLOG</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#09090B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRONLOG">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">

<style>
:root{
  --bg:#09090B; --card:#131316; --card-2:#1B1B20; --card-3:#232329;
  --line:#26262C; --line-2:#33333B;
  --tx:#FAFAFA; --tx-2:#A1A1AA; --tx-3:#6B6B75; --white:#FFFFFF;
  --chest:#FF6B5A; --back:#4C9AFF; --shoulder:#FFB020; --leg:#A78BFA;
  --arm:#2DD4BF; --abs:#84CC16; --cardio:#F472B6;
  --good:#4ADE80; --warn:#FB923C;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,monospace;
  --sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;

  /* 금속 질감 · 모션 */
  --e:cubic-bezier(.2,.9,.25,1);
  --edge:inset 0 1px 0 rgba(255,255,255,.055);
  --edge2:inset 0 1px 0 rgba(255,255,255,.09);
  --steel:linear-gradient(180deg,#20222A 0%,#16171C 55%,#121317 100%);
  --steel-h:linear-gradient(180deg,#2A2D36 0%,#1C1E24 100%);
  --r-lg:12px; --r-md:10px; --r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:contain}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select{font-family:inherit;font-variant-numeric:tabular-nums;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:0 15px 150px}

/* ══ 헤더 ══ */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) 0 8px}
.hdr:after{content:'';position:absolute;left:-15px;right:-15px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-2) 18%,var(--line-2) 82%,transparent)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.brand{
  font-size:13.5px;font-weight:900;letter-spacing:.3em;
  display:flex;align-items:center;gap:9px;
  background:linear-gradient(180deg,#FFFFFF 0%,#C9CCD4 48%,#8A8F9A 52%,#F2F3F6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand:before{content:'';width:3px;height:15px;border-radius:1px;flex:none;
  background:linear-gradient(180deg,#FFF,#7C818C)}
/* 바벨 널링 질감 */
.knurl{position:absolute;left:-15px;right:-15px;top:0;height:calc(100% - 1px);
  pointer-events:none;opacity:.045;
  background-image:repeating-linear-gradient(58deg,#fff 0 1px,transparent 1px 6px),
                   repeating-linear-gradient(-58deg,#fff 0 1px,transparent 1px 6px);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 62%);
  mask-image:linear-gradient(90deg,#000,transparent 62%)}
.hdr-btns{display:flex;gap:7px}
.ibtn{width:34px;height:34px;border-radius:var(--r-sm);background:var(--steel);
  border:1px solid var(--line-2);color:var(--tx-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--edge2);
  transition:transform .1s var(--e),color .15s var(--e)}
.ibtn:active{transform:scale(.92);color:var(--tx)}
.ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{background:var(--card-2)}

/* 날짜 네비게이션 */
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dnav button{background:var(--steel);border:1px solid var(--line-2);border-radius:var(--r-md);
  color:var(--tx-2);cursor:pointer;height:42px;flex:none;width:42px;font-size:17px;
  box-shadow:var(--edge2);transition:transform .1s var(--e)}
.dnav button:active{transform:scale(.93)}
.dnav button:active{background:var(--card-2)}
.dnav-mid{flex:1;min-width:0;text-align:center;background:var(--steel);
  border:1px solid var(--line-2);border-radius:var(--r-md);height:42px;box-shadow:var(--edge2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.dnav-mid b{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dnav-mid span{font-size:10px;color:var(--tx-3);font-weight:700}
.dnav-mid.past{border-color:var(--warn);background:rgba(251,146,60,.08)}
.dnav-mid.past span{color:var(--warn)}

/* ══ 공통 ══ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;
  margin-bottom:11px;box-shadow:var(--edge)}
.sec{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--tx-3);
  margin:22px 3px 9px;display:flex;align-items:center;gap:9px}
.sec:after{content:'';flex:1;height:1px;background:var(--line)}
.empty{text-align:center;color:var(--tx-3);font-size:13px;padding:26px 14px;line-height:1.75}
.btn{border:none;border-radius:var(--r-md);cursor:pointer;font-weight:800;font-size:15px;
  padding:14px;width:100%;letter-spacing:-.01em;
  background:linear-gradient(180deg,#FFFFFF 0%,#E8E8EC 100%);color:#09090B;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 10px rgba(0,0,0,.35);
  transition:transform .1s var(--e),filter .1s var(--e)}
.btn:active{transform:scale(.976);filter:brightness(.94)}
.btn-g{background:var(--steel);color:var(--tx);border:1px solid var(--line-2);
  box-shadow:var(--edge2)}
.btn-g:active{background:var(--steel-h)}
.btn-sm{padding:11px;font-size:13.5px;border-radius:var(--r-sm)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.stat{background:var(--steel);border:1px solid var(--line);border-radius:var(--r-md);
  padding:11px 10px;box-shadow:var(--edge)}
.stat b{display:block;font-size:21px;font-weight:900;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:10px;color:var(--tx-3);margin-top:1px;font-weight:700}

/* ══ 운동 카드 (아코디언) ══ */
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:9px;overflow:hidden;box-shadow:var(--edge);
  transition:border-color .2s var(--e)}
.ex.open{border-color:var(--line-2)}
.ex-hd{display:flex;align-items:center;gap:10px;padding:13px 13px;cursor:pointer}
.ex-cl{width:3px;height:32px;border-radius:2px;flex:none}
.ex-tt{flex:1;min-width:0}
.ex-tt b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.025em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-tt span{font-size:11px;color:var(--tx-3);font-weight:600}
.ex-tt em{font-style:normal;color:var(--tx-2)}
.ex-ar{color:var(--tx-3);font-size:12px;flex:none;transition:transform .18s}
.ex.open .ex-ar{transform:rotate(180deg)}
.ex-bd{border-top:1px solid var(--line)}

/* 세트 테이블 */
.st-h,.st-r{display:grid;grid-template-columns:22px minmax(0,1fr) 78px 44px 30px 24px;
  align-items:center;gap:5px;padding:0 13px}
.st-h{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--tx-3);
  padding-top:10px;padding-bottom:6px}
.st-r{padding-top:8px;padding-bottom:8px;border-top:1px solid var(--line);font-size:14px}
.st-n{font-family:var(--mono);font-size:11px;color:var(--tx-3)}
.st-p{font-size:11px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-v{font-weight:800;letter-spacing:-.02em}
.st-v small{font-size:10px;color:var(--tx-3);font-weight:600}
.st-e{font-size:10px;color:var(--tx-3);font-weight:700;text-align:center}
.st-x{background:none;border:none;color:var(--tx-3);cursor:pointer;font-size:14px;padding:3px}
.st-r.pr{background:rgba(74,222,128,.06)}
.badge{display:inline-block;font-size:8px;font-weight:900;letter-spacing:0;
  background:var(--good);color:#052E16;padding:1px 3px;border-radius:3px;margin-left:3px;
  vertical-align:1.5px;white-space:nowrap}
.st-v{white-space:nowrap;overflow:hidden}

/* 입력 바 */
.ip{padding:11px 13px 13px;background:var(--card-2);border-top:1px solid var(--line)}
.ip-r{display:flex;gap:7px;align-items:flex-end}
.fd{flex:1;min-width:0}
.fd label{display:block;font-size:9.5px;color:var(--tx-3);font-weight:800;
  letter-spacing:.05em;margin-bottom:4px}
.fb{display:flex;gap:4px}
.fb button{width:30px;height:38px;flex:none;background:var(--steel);border:1px solid var(--line-2);
  border-radius:var(--r-sm);color:var(--tx-2);font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:var(--edge2);transition:transform .09s var(--e),background .12s var(--e)}
.fb button:active{transform:scale(.9);background:var(--steel-h);color:var(--tx)}
.fb input{flex:1;min-width:0;width:100%;height:38px;background:#101013;
  border:1px solid var(--line-2);border-radius:8px;color:var(--tx);
  font-size:16px;font-weight:800;text-align:center;letter-spacing:-.02em}
.ip-go{width:74px;flex:none;height:38px;color:#09090B;border:none;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:900;cursor:pointer;letter-spacing:-.01em;
  background:linear-gradient(180deg,#FFFFFF,#E4E4E8);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 8px rgba(0,0,0,.4);
  transition:transform .09s var(--e),filter .09s var(--e)}
.ip-go:active{transform:scale(.94);filter:brightness(.93)}
.rp{display:flex;gap:4px;margin-top:9px;align-items:center}
.rp em{font-style:normal;font-size:9.5px;color:var(--tx-3);font-weight:800;
  letter-spacing:.05em;width:26px;flex:none}
.rp button{flex:1;background:#101013;border:1px solid var(--line-2);border-radius:7px;
  color:var(--tx-3);font-size:11.5px;font-weight:800;padding:6px 0;cursor:pointer;
  transition:transform .09s var(--e),background .15s var(--e),color .15s var(--e)}
.rp button:active{transform:scale(.93)}
.rp button[aria-pressed=true]{background:var(--white);color:#09090B;border-color:var(--white)}

.pls{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-2)}
.pl-bar{display:flex;align-items:center;justify-content:center;height:32px;gap:1.5px}
.pl-s{height:4px;background:linear-gradient(#C6CDD8,#6E7684);border-radius:2px;flex:none}
.pl-p{width:7px;border-radius:1.5px;flex:none;border:1px solid rgba(0,0,0,.4)}
.pl-t{text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--tx-3);margin-top:2px}

/* PR 요약 줄 */
.prl{display:flex;align-items:center;gap:8px;padding:10px 13px;cursor:pointer;
  border-top:1px solid var(--line);font-size:12px;font-weight:700}
.prl.go{background:rgba(74,222,128,.09);color:#86EFAC}
.prl.wait{background:rgba(251,146,60,.09);color:#FDBA74}
.prl.near{background:var(--card-2);color:var(--tx-2)}
.prl span{flex:1;min-width:0}
.prl i{font-style:normal;font-size:11px;opacity:.7}

/* ══ 휴식 타이머 ══ */
.tmr{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));
  z-index:34;max-width:520px;margin:0 auto;padding:0 15px;
  transform:translateY(120%);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.tmr.on{transform:none}
.tmr-in{background:#17171C;border:1px solid var(--line-2);border-radius:14px;
  padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.tmr-t{display:flex;align-items:center;gap:10px}
.tmr-n{font-size:23px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-width:66px}
.tmr-l{flex:1;min-width:0;font-size:11px;color:var(--tx-3);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr-b{background:var(--card-3);border:1px solid var(--line-2);border-radius:8px;
  color:var(--tx);font-size:11.5px;font-weight:800;padding:7px 10px;cursor:pointer;flex:none}
.tmr-b.w{background:var(--white);color:#09090B;border-color:var(--white)}
.tmr-p{height:3px;background:var(--card-3);border-radius:2px;margin-top:8px;overflow:hidden}
.tmr-p i{display:block;height:100%;background:var(--white);border-radius:2px;transition:width .95s linear}
.tmr.done .tmr-n{color:var(--good)}
.tmr.done .tmr-p i{background:var(--good)}

/* ══ 탭바 ══ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:36;display:flex;justify-content:center;
  padding:7px 12px calc(9px + env(safe-area-inset-bottom));
  background:rgba(9,9,11,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line)}
.tabbar-in{display:flex;width:100%;max-width:520px}
.tab{flex:1;background:none;border:none;cursor:pointer;color:var(--tx-3);
  padding:6px 0 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:9.5px;font-weight:800}
.tab{transition:color .18s var(--e)}
.tab svg{transition:transform .2s var(--e)}
.tab:active svg{transform:scale(.86)}
.tab[aria-selected=true]{color:var(--tx)}
.tab[aria-selected=true] svg{filter:drop-shadow(0 0 7px rgba(255,255,255,.32))}
.tab[aria-selected=true] span{letter-spacing:.02em}

/* ══ 시트 ══ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:40;opacity:0;
  pointer-events:none;transition:.2s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;
  background:#0F0F12;border:1px solid var(--line);border-bottom:none;
  border-radius:20px 20px 0 0;height:88vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sh-g{width:34px;height:4px;background:var(--line-2);border-radius:2px;margin:9px auto 3px;flex:none}
.sh-h{padding:7px 16px 11px;flex:none}
.sh-h h2{font-size:18px;font-weight:900;letter-spacing:-.03em}
.sh-b{flex:1;overflow-y:auto;padding:0 16px calc(26px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sh-x{position:absolute;right:13px;top:15px;background:var(--card-2);border:1px solid var(--line-2);
  width:29px;height:29px;border-radius:50%;color:var(--tx-2);font-size:14px;cursor:pointer;line-height:1}

.search{width:100%;background:var(--card-2);border:1px solid var(--line-2);border-radius:11px;
  color:var(--tx);font-size:15px;padding:11px 13px;margin-bottom:10px}
.search::placeholder{color:var(--tx-3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--card-2);border:1px solid var(--line-2);border-radius:9px;
  color:var(--tx-2);font-size:12.5px;font-weight:700;padding:7px 13px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--white);color:#09090B;border-color:var(--white)}
.seg{display:flex;background:var(--card-2);border:1px solid var(--line-2);border-radius:10px;
  padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:none;border-radius:7px;color:var(--tx-3);
  font-size:12.5px;font-weight:800;padding:8px 0;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--line-2);color:var(--tx)}
.grp{font-size:9.5px;font-weight:800;letter-spacing:.13em;color:var(--tx-3);margin:14px 2px 7px}
.pick{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer;text-align:left;color:var(--tx)}
.pick-d{width:6px;height:6px;border-radius:50%;flex:none}
.pick-t{flex:1;min-width:0}
.pick-t b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.pick-t span{font-size:10.5px;color:var(--tx-3)}
.pick-g{color:var(--tx-3);font-size:16px;flex:none}
.pick-k{font-size:13px;font-weight:800;flex:none}

.pf{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.pf label{display:block;font-size:10.5px;color:var(--tx-3);font-weight:700;margin-bottom:4px}
.pf input,.pf select{width:100%;background:var(--card-2);border:1px solid var(--line-2);
  border-radius:10px;color:var(--tx);font-size:15px;font-weight:700;padding:10px 11px}
.pf-w{grid-column:1/-1}
.note{font-size:10.5px;color:var(--tx-3);line-height:1.75;margin-top:11px}

/* ══ 식단 ══ */
.ring-c{background:var(--card);border:1px solid var(--line);border-radius:17px;
  padding:17px 15px;margin-bottom:11px;display:flex;align-items:center;gap:17px}
.ring{width:104px;height:104px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring-m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-m b{font-size:23px;font-weight:900;letter-spacing:-.04em;line-height:1}
.ring-m span{font-size:9.5px;color:var(--tx-3);margin-top:3px;font-weight:600}
.macros{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.mh{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;margin-bottom:4px}
.mh b{font-weight:700}
.mh span{color:var(--tx-3);font-size:10.5px;font-weight:600}
.trk{height:6px;background:var(--card-2);border-radius:3px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:3px;transition:width .3s}
.meal{margin-bottom:11px}
.meal-h{display:flex;align-items:center;justify-content:space-between;padding:0 3px 7px}
.meal-h b{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.meal-h span{font-size:11.5px;color:var(--tx-3);font-weight:700}
.meal-b{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.food{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
.food-t{flex:1;min-width:0}
.food-t b{display:block;font-size:13.5px;font-weight:700}
.food-t span{font-size:10.5px;color:var(--tx-3)}
.food-k{font-size:12.5px;font-weight:800;color:var(--tx-2)}
.food-x{background:none;border:none;color:var(--tx-3);cursor:pointer;font-size:14px;padding:2px}
.food-a{width:100%;background:none;border:none;color:var(--tx-2);font-size:12.5px;
  font-weight:700;padding:12px;cursor:pointer}
.qty{display:flex;align-items:center;gap:8px;margin:13px 0 3px}
.qty button{width:38px;height:38px;background:var(--card-2);border:1px solid var(--line-2);
  border-radius:10px;color:var(--tx);font-size:16px;font-weight:700;cursor:pointer}
.qty div{flex:1;text-align:center;font-size:16px;font-weight:800}
.mpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px}
.mpick button{background:var(--card-2);border:1px solid var(--line-2);border-radius:9px;
  color:var(--tx-2);font-size:12.5px;font-weight:700;padding:10px 0;cursor:pointer}
.mpick button[aria-pressed=true]{background:var(--white);color:#09090B;border-color:var(--white)}

/* ══ 기록실 ══ */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h b{font-size:17px;font-weight:900;letter-spacing:-.03em}
.cal-h button{background:var(--card);border:1px solid var(--line);border-radius:9px;

/* 사용자가 직접 추가한 종목·음식을 합쳐서 조회표를 다시 만든다 */
let DB = {}, EX = {}, FOOD = {}, FOODMAP = {};

function rebuildIndex(){
  DB = {};
  PARTS.forEach(p => {
    DB[p.id] = { free: BASE_DB[p.id].free.slice(), machine: BASE_DB[p.id].machine.slice() };
  });
  (D.customEx || []).forEach(c => {
    if (DB[c.part]) DB[c.part][c.group].push([c.name, c.kind, c.inc]);
  });
  EX = {};
  PARTS.forEach(p => ['free','machine'].forEach(g =>
    DB[p.id][g].forEach(([name, kind, inc]) => {
      EX[name] = { name, kind, inc, part:p.id, group:g,
                   custom:(D.customEx||[]).some(c => c.name === name) };
    })));

  FOOD = {};
  Object.keys(BASE_FOOD).forEach(c => FOOD[c] = BASE_FOOD[c].slice());
  if ((D.customFood || []).length){
    FOOD['내가 추가한 음식'] = (D.customFood || []).map(f => [f.name, f.unit, f.kcal, f.c, f.p, f.f]);
  }
  FOODMAP = {};
  Object.keys(FOOD).forEach(cat => FOOD[cat].forEach(f =>
    FOODMAP[f[0]] = { cat, name:f[0], unit:f[1], kcal:f[2], c:f[3], p:f[4], f:f[5] }));
}
const partOf = id => PARTS.find(p => p.id === id) || PARTS[0];

async function loadData(){
  let raw = null;
  try{
    if (window.storage){
      const r = await window.storage.get(KEY, false);
      if (r && r.value) raw = r.value;
    }
  }catch(e){}
  if (!raw){ try{ raw = localStorage.getItem(KEY); }catch(e){} }
  let parsed = {};
  if (raw){ try{ parsed = JSON.parse(raw) || {}; }catch(e){} }
  /* 예전 버전 데이터에 없던 항목은 기본값으로 채운다 */
  return Object.assign({}, BLANK, parsed);
}
/* 지운 기록은 묘비에 남긴다. 안 그러면 다른 기기와 합칠 때 되살아난다. */
function bury(){
  D.tomb = D.tomb || {};
  for (let i = 0; i < arguments.length; i++) D.tomb[arguments[i]] = Date.now();
}

async function saveData(){

  try{ if (window.storage){ await window.storage.set(KEY, json, false); safePush(); return; } }catch(e){}
  try{ localStorage.setItem(KEY, json); }catch(e){}
  safePush();
}

function josa(w, a, b){
  const c = String(w).charCodeAt(String(w).length-1);

}

function plateHTML(total){

  let side = (total-BAR)/2;
  const out = [], cnt = {};
  for (const [kg,color,h] of PLATE){

      out.push('<i class="pl-p" style="height:'+h+'px;background:'+color+'"></i>');

         '<i class="pl-s" style="width:40px"></i></div><div class="pl-t">한쪽에 '+txt+'</div>';
}

/* ═══════════════════════════════════════════════════
   6. 1RM 추정
   ═══════════════════════════════════════════════════ */
function e1rm(w, r){
  if (!w || !r || r < 1) return 0;
  if (r === 1) return w;
  if (r > 12) return 0;
  return (w*(1+r/30) + w/(1.0278-0.0278*r))/2;
}
const setE1 = s => e1rm(s.w, s.r);
const roundTo = (v, i) => Math.round(v/i)*i;
function repsNeeded(w, t){ for (let r=1;r<=12;r++) if (e1rm(w,r) > t) return r; return null; }
function weightNeeded(r, t, i){ const per = e1rm(1,r); return per ? Math.ceil(t/per/i)*i : null; }

const setsOf = id => D.sets.filter(s => s.slotId === id);
const slotsOn = d => D.slots.filter(s => s.date === d);
const mealsOn = d => D.meals.filter(m => m.date === d);

function volumeOf(s){
  const ex = EX[s.exId];
  if (!ex || ex.kind === 'cardio' || ex.kind === 'hold') return 0;
  return (s.w||0) * (s.r||0);
}
function dayVolume(d){ let v=0; slotsOn(d).forEach(sl => setsOf(sl.id).forEach(s => v += volumeOf(s))); return v; }
function daySets(d){ let c=0; slotsOn(d).forEach(sl => c += setsOf(sl.id).length); return c; }

function prevSession(exId, before){
  const past = D.slots.filter(s => s.exId === exId && s.date < before)
                      .sort((a,b) => b.date.localeCompare(a.date));
  for (const sl of past){ const ss = setsOf(sl.id); if (ss.length) return { date:sl.date, sets:ss }; }
  return null;
}
function bestOf(exId){
  let m = 0;
  D.slots.filter(s => s.exId === exId).forEach(sl =>
    setsOf(sl.id).forEach(s => { if ((s.w||0) > m) m = s.w; }));
  return m;
}
function setLabel(s){
  const ex = EX[s.exId] || {};
  if (ex.kind === 'cardio'){
    const b = [];
    if (s.min) b.push(s.min+'분');
    if (s.dist) b.push(s.dist+'km');
    return b.join(' · ') || '기록';
  }
  if (ex.kind === 'hold') return (s.sec||0)+'초';
  if (!s.w) return '맨몸 × '+s.r;
  return s.w+'kg × '+s.r;
}

/* 영양 목표 (Mifflin-St Jeor) */
function targets(){
  const p = D.profile;
  if (!p) return null;
  const bmr = p.sex === 'm' ? 10*p.kg+6.25*p.cm-5*p.age+5 : 10*p.kg+6.25*p.cm-5*p.age-161;
  const tdee = bmr * p.act;
  const kcal = Math.round(tdee * (p.goal==='cut'?0.82 : p.goal==='bulk'?1.12 : 1));
  const pr = Math.round(p.kg * (p.goal==='cut'?2.2 : p.goal==='bulk'?1.8 : 1.9));
  const fat = Math.round(kcal*0.25/9);
  const carb = Math.max(0, Math.round((kcal - pr*4 - fat*9)/4));
  return { kcal, p:pr, f:fat, c:carb, tdee:Math.round(tdee) };
}
function eaten(d){
  const t = { kcal:0, c:0, p:0, f:0 };
  mealsOn(d).forEach(m => {
    const f = FOODMAP[m.food]; if (!f) return;
    t.kcal += f.kcal*m.qty; t.c += f.c*m.qty; t.p += f.p*m.qty; t.f += f.f*m.qty;
  });
  return { kcal:Math.round(t.kcal), c:Math.round(t.c), p:Math.round(t.p), f:Math.round(t.f) };
}

const T = { on:false, mode:'rest', left:0, total:0, up:0, tick:null, label:'', paused:false };

/* 종목 성격에 따른 기본 휴식 시간 */
function defaultRest(exName){
  if (D.restPref && D.restPref[exName]) return D.restPref[exName];
  const ex = EX[exName];
  if (!ex) return 90;
  if (ex.kind === 'cardio') return 0;
  if (BIG.has(exName)) return 180;
  if (ex.kind === 'bar') return 150;
  if (ex.kind === 'body' || ex.kind === 'hold') return 60;
  return 90;
}
const mmss = s => {
  s = Math.max(0, Math.round(s));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
};

function beep(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const c = new C();
    [0, 0.18, 0.36].forEach(t => {
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25, c.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t+0.14);
      o.start(c.currentTime+t); o.stop(c.currentTime+t+0.16);
    });
    setTimeout(() => { try{ c.close(); }catch(e){} }, 1200);
  }catch(e){}
}

function paintTimer(){
  const el = $('#tmr');
  if (!T.on){ el.classList.remove('on','done','warn'); syncFab(); return; }
  el.classList.add('on');
  if (T.mode === 'rest'){
    const done = T.left <= 0;
    el.classList.toggle('done', done);
    el.classList.toggle('warn', !done && T.left <= 5 && T.left > 0);
    $('#tmrN').textContent = done ? '완료' : mmss(T.left);
    $('#tmrL').textContent = (T.paused ? '일시정지 · ' : '') + (T.label || '휴식');
    $('#tmrP').style.width = (T.total ? Math.max(0, T.left/T.total*100) : 0) + '%';
    $('#tmrAdd').textContent = '+30초';
    $('#tmrEnd').textContent = done ? '닫기' : '건너뛰기';
  } else {
    el.classList.remove('done');
    $('#tmrN').textContent = mmss(T.up);
    $('#tmrL').textContent = (T.paused ? '일시정지 · ' : '') + '스톱워치';
    $('#tmrP').style.width = '100%';
    $('#tmrAdd').textContent = T.paused ? '계속' : '일시정지';
    $('#tmrEnd').textContent = '종료';
  }
  /* 열려 있는 운동 카드의 휴식 표시도 같이 갱신 */
  const live = document.querySelector('.rest-mid.live b');
  if (live && T.mode === 'rest') live.textContent = mmss(T.left);
  syncFab();
}
function syncFab(){
  const up = T.on;
  $('#catFab').classList.toggle('up', up);
  $('#catBB').classList.toggle('up', up);
}

function tickFn(){
  if (T.paused) return;
  if (T.mode === 'rest'){
    if (T.left > 0){
      T.left--;
      if (T.left === 0){ beep(); vibrate([200,90,200]); toast('휴식 끝 — 다음 세트'); }
    }
  } else {
    T.up++;
  }
  paintTimer();
}
function ensureTick(){
  if (T.tick) clearInterval(T.tick);
  T.tick = setInterval(tickFn, 1000);
}

function startRest(sec, label){
  if (!sec) return;
  T.on = true; T.mode = 'rest'; T.total = sec; T.left = sec;
  T.label = label || '휴식'; T.paused = false;
  ensureTick(); paintTimer();
  /* 열려 있는 운동 카드의 휴식 버튼을 '휴식 중' 상태로 바꾸기 위해 다시 그린다 */
  if (typeof tab !== 'undefined' && tab === 'workout' && openEx) render();
}
function startWatch(){
  T.on = true; T.mode = 'watch'; T.up = 0; T.paused = false;
  ensureTick(); paintTimer();
}
function stopTimer(){
  T.on = false; T.paused = false;
  if (T.tick){ clearInterval(T.tick); T.tick = null; }
  paintTimer();
  if (typeof tab !== 'undefined' && tab === 'workout' && openEx) render();
}
function timerAdd(){
  if (!T.on) return;
  if (T.mode === 'rest'){ T.left += 30; T.total = Math.max(T.total, T.left); }
  else { T.paused = !T.paused; }
  paintTimer();
}

/* 백그라운드에 있다가 돌아왔을 때 시간 보정 */
let hiddenAt = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  if (hiddenAt && T.on && !T.paused){
    const gone = Math.round((Date.now()-hiddenAt)/1000);
    if (T.mode === 'rest'){
      const was = T.left;
      T.left = Math.max(0, T.left - gone);
      if (was > 0 && T.left === 0) toast('휴식 시간이 끝나 있었어요');
    } else T.up += gone;
    paintTimer();
  }
  hiddenAt = null;
});

/* 타이머 설정 시트 */
function openTimer(){
  const opts = [60, 90, 120, 150, 180, 240];
  let h = '<div class="seg" style="margin-bottom:14px">' +
    '<button aria-pressed="'+(T.on && T.mode==='rest')+'" onclick="tmSet(\'rest\')">휴식 타이머</button>' +

  h += '<div class="grp">바로 시작</div><div class="chips" style="flex-wrap:wrap">' +

/* 운동 카드에서 바로 휴식 시간 조절 — 돌아가는 타이머에도 즉시 반영 */
async function restAdj(name, d){
  D.restPref = D.restPref || {};
  const next = Math.max(15, Math.min(600, defaultRest(name) + d));
  D.restPref[name] = next;
  if (T.on && T.mode === 'rest' && T.label === name){
    T.left = Math.max(0, T.left + d);
    T.total = Math.max(T.total, T.left, next);
  }
  await saveData(); render();
  toast('휴식 '+mmss(next)+'로 설정');
}

async function restPref(name, d){
  D.restPref = D.restPref || {};
  D.restPref[name] = Math.max(30, Math.min(600, defaultRest(name) + d));
  await saveData(); openTimer();
}

function exCard(sl){
  const ex = EX[sl.exId];
  if (!ex) return '';
  const part = partOf(ex.part);
  const ss = setsOf(sl.id);
  const open = openEx === sl.id;
  const best = bestOf(sl.exId);

  /* 접힌 상태 요약 */
  let sum;
  if (!ss.length) sum = '기록 없음';
  else if (ex.kind === 'cardio'){
    const mn = ss.reduce((a,s) => a+(s.min||0), 0), km = r1(ss.reduce((a,s) => a+(s.dist||0), 0));
    sum = (mn?mn+'분':'') + (km?' · '+km+'km':'');
  } else if (ex.kind === 'hold'){
    sum = ss.length+'세트 · 최고 '+Math.max(...ss.map(s => s.sec||0))+'초';
  } else {
    const top = ss.reduce((a,s) => (s.w>a.w?s:a), ss[0]);
    sum = ss.length+'세트 · 최고 '+setLabel(top);
  }

  let h = '<div class="ex'+(open?' open':'')+'">';
  h += '<div class="ex-hd" onclick="toggleEx(\''+sl.id+'\')">' +
    '<i class="ex-cl" style="background:'+part.color+'"></i>' +
    '<div class="ex-tt"><b>'+esc(ex.name)+'</b><span>'+part.name+' · '+KIND[ex.kind]+
      ' · <em>'+sum+'</em></span></div>' +
    '<span class="ex-ar">▾</span></div>';

  if (!open) return h + '</div>';

  h += '<div class="ex-bd">';

  /* PR 한 줄 요약 — 없으면 정체 알림 */
  const a = prAnalysis(sl);
  if (a){
    const txt = a.verdict === 'go' ? '🔥 PR 도전 가능 · 추정 '+a.topE+'kg'
      : a.verdict === 'wait' ? '⏸ 기록은 PR급 · 오늘은 참으세요'
      : (a.need.short < 0.5 ? '📊 역대 최고와 동률' : '📈 PR까지 '+a.need.short+'kg');
    h += '<div class="prl '+a.verdict+'" onclick="openPR(\''+sl.id+'\')">' +
         '<span>'+txt+'</span><i>자세히 ›</i></div>';
  } else {
    const stl = stallCheck(sl.exId);
    if (stl){
      h += '<div class="stall'+(stl.level==='hard'?' hard':'')+'" onclick="openTrend(\''+q(sl.exId)+'\')">' +
        '<span>'+(stl.down ? '📉 수행능력 하락 · 디로드 권장' : '⏸ '+stl.n+'세션째 정체')+'</span>' +
        '<i>해법 보기 ›</i></div>';
    }
  }

  /* 세트 표 */
  const hd = ex.kind === 'cardio' ? ['#','이전','분','km','','']
           : ex.kind === 'hold'   ? ['#','이전','초','','RPE','']
           : ['#','이전','kg','회','RPE',''];
  h += '<div class="st-h">'+hd.map(x => '<span>'+x+'</span>').join('')+'</div>';

  const prev = prevSession(sl.exId, sl.date);
  ss.forEach((s, i) => {
    const p = prev && prev.sets[i] ? setLabel(prev.sets[i]) : '—';
    const bg = prBadge(s);
    let c3, c4;
    if (ex.kind === 'cardio'){ c3 = (s.min||0); c4 = (s.dist||0)||''; }
    else if (ex.kind === 'hold'){ c3 = (s.sec||0); c4 = ''; }
    else { c3 = (s.w>0 ? s.w : '맨몸'); c4 = s.r; }
    h += '<div class="st-r'+(bg?' pr':'')+(s.id===flashId?' flash':'')+'" onclick="editSet(\''+s.id+'\')">' +
      '<span class="st-n">'+(i+1)+'</span>' +
      '<span class="st-p">'+p+'</span>' +
      '<span class="st-v">'+c3+bg+'</span>' +
      '<span class="st-v">'+c4+'</span>' +
      '<span class="st-e">'+(s.rpe||'')+'</span>' +
      '<button class="st-x" onclick="event.stopPropagation();rmSet(\''+s.id+'\')" aria-label="삭제">✕</button></div>';
  });

  /* 입력 바 */
  const dr = draft[sl.id] || (draft[sl.id] = mkDraft(sl));
  h += '<div class="ip"><div class="ip-r">';
  if (ex.kind === 'cardio'){
    h += fld(sl.id,'min','시간 (분)',dr.min,5) + fld(sl.id,'dist','거리 (km)',dr.dist,0.5);
  } else if (ex.kind === 'hold'){
    h += fld(sl.id,'sec','시간 (초)',dr.sec,10);
  } else {
    h += fld(sl.id,'w', ex.kind==='body'?'추가 kg':'중량 kg', dr.w, ex.inc||2.5) +
         fld(sl.id,'r','횟수',dr.r,1);

  if (ex.kind !== 'cardio'){

      '<button aria-pressed="'+(v===dr.rpe)+'" onclick="setDr(\''+sl.id+'\',\'rpe\','+v+',1)">'+v+'</button>'
    ).join('') + '</div>';

  if (ex.kind === 'bar' && dr.w > 0) h += '<div class="pls">'+plateHTML(dr.w)+'</div>';

  /* 하단 조작 */

      '<b>'+(isMine ? mmss(T.left) : mmss(rest))+'</b>' +
      '<span>'+(isMine ? '휴식 중 · 눌러 재시작' : '휴식 시간'+(custom?' · 직접 설정':''))+'</span></button>' +
    '<button class="rest-pm" onclick="restAdj(\''+q(ex.name)+'\',15)" aria-label="휴식 시간 늘리기">+15</button></div>';

  h += '<div style="display:flex;gap:7px;padding:0 13px 12px">' +
    '<button class="btn btn-g btn-sm" onclick="openTrend(\''+q(ex.name)+'\')">성장 추이</button>' +

  return h + '</div></div>';
}

function fld(id, key, label, val, step){
  return '<div class="fd"><label>'+label+'</label><div class="fb">' +
    '<button onclick="bump(\''+id+'\',\''+key+'\',-'+step+')" aria-label="빼기">−</button>' +
    '<input inputmode="decimal" value="'+val+'" onchange="setDr(\''+id+'\',\''+key+'\',this.value)" oninput="setDr(\''+id+'\',\''+key+'\',this.value)">' +
    '<button onclick="bump(\''+id+'\',\''+key+'\','+step+')" aria-label="더하기">＋</button></div></div>';
}

function mkDraft(sl){
  const ex = EX[sl.exId];
  const ss = setsOf(sl.id);
  const last = ss.length ? ss[ss.length-1] : null;
  const prev = prevSession(sl.exId, sl.date);
  const ref = last || (prev ? prev.sets[prev.sets.length-1] : null);
  return {
    w: ref && ref.w ? ref.w : (ex.kind==='body' ? 0 : (ex.inc ? ex.inc*8 : 20)),
    r: ref && ref.r ? ref.r : 10,
    rpe: 8,
    min: ref && ref.min ? ref.min : 20,
    dist: ref && ref.dist ? ref.dist : 0,
    sec: ref && ref.sec ? ref.sec : 60
  };
}

/* 세트 배지 */
function prBadge(set){
  const i = D.sets.indexOf(set);
  if (i < 0 || !set.w || !set.r) return '';
  const prior = D.sets.slice(0,i).filter(s => s.exId === set.exId && s.w > 0);
  if (!prior.length) return '';
  if (set.w > Math.max(...prior.map(s => s.w))) return '<span class="badge">중량</span>';
  const mE = Math.max(...prior.map(setE1));
  if (mE > 0 && setE1(set) > mE) return '<span class="badge">1RM</span>';
  const same = prior.filter(s => s.w === set.w);
  if (same.length && set.r > Math.max(...same.map(s => s.r))) return '<span class="badge">렙</span>';
  return '';
}

/* PR 분석 */
function prAnalysis(sl){
  const ex = EX[sl.exId];
  if (!ex || !BIG.has(ex.name)) return null;
  const inc = ex.inc || 2.5;
  const ts = setsOf(sl.id).filter(s => s.w > 0 && s.r > 0);
  if (!ts.length) return null;

  let top = null, topE = 0;
  ts.forEach(s => { const e = setE1(s); if (e > topE){ topE = e; top = s; } });
  if (!topE) return null;

  let prW = 0, prE = 0, lastHeavy = null;
  D.slots.filter(x => x.exId === sl.exId && x.date < sl.date).forEach(x =>
    setsOf(x.id).forEach(s => {
      if (s.w > prW) prW = s.w;
      const e = setE1(s); if (e > prE) prE = e;
      if (s.r <= 2 && s.w > 0 && (!lastHeavy || x.date > lastHeavy)) lastHeavy = x.date;
    }));
  if (!prW) return null;

  const pr = Math.max(prE, prW), gap = topE - pr, beats = gap > 0.5;
  const rpeOK = !top.rpe || top.rpe <= 8;
  const freshOK = ts.length <= 6;
  const days = lastHeavy ? Math.round((new Date(sl.date)-new Date(lastHeavy))/864e5) : null;
  const restOK = days === null || days >= 14;

  let ladder = [];
  if (beats){
    [Math.max(prW+inc, topE*0.90), topE*0.95, topE].map(v => roundTo(v,inc))
      .forEach(v => { if (v > prW && !ladder.includes(v)) ladder.push(v); });
    ladder.sort((a,b) => a-b); ladder = ladder.slice(0,3);
  }
  const goal = ladder.length ? ladder[ladder.length-1] : 0;
  const warm = goal ? [[0.4,5],[0.55,3],[0.7,2],[0.8,1],[0.9,1]]
    .map(([p,r]) => ({ w:roundTo(goal*p,inc), r })).filter((x,i,a) => i===0 || x.w > a[i-1].w) : [];

  let need = null;
  if (!beats){
    const rN = repsNeeded(top.w, pr), wN = weightNeeded(top.r, pr, inc);
    need = { byReps: rN && rN > top.r ? { w:top.w, r:rN } : null,
             byWeight: wN && wN > top.w ? { w:wN, r:top.r } : null,
             short: r1(pr - topE) };
  }
  return { ex, inc, top, topE:r1(topE), pr:r1(pr), prW, gap:r1(gap), beats,
           rpeOK, freshOK, restOK, days, ladder, warm, need, nSets:ts.length,
           verdict: !beats ? 'near' : (rpeOK && freshOK && restOK ? 'go' : 'wait') };
}

function recMonth(){
  const a = new Date(recAnchor);
  const y = a.getFullYear(), m = a.getMonth();
  const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
  const lead = first.getDay(), total = last.getDate();

  let h = '<div class="cal-h">' +
    '<button onclick="recMove(-1)">‹</button>' +
    '<b>'+y+'년 '+(m+1)+'월</b>' +
    '<button onclick="recMove(1)">›</button></div>';

  h += '<div class="cal">' + DAYS.map(d => '<div class="cal-w">'+d+'</div>').join('');
  for (let i=0;i<lead;i++) h += '<div class="cal-d off"></div>';

  let mVol = 0, mDays = 0, mSets = 0;
  for (let day=1; day<=total; day++){
    const ds = iso(new Date(y, m, day));
    const info = dayInfo(ds);
    const lv = info.sets === 0 ? '' : info.vol > 6000 ? ' l3' : info.vol > 2500 ? ' l2' : ' l1';
    if (info.sets){ mDays++; mVol += info.vol; mSets += info.sets; }
    const dots = info.parts.slice(0,4).map(p =>
      '<i style="background:'+partOf(p).color+'"></i>').join('');
    h += '<button class="cal-d'+lv+(ds===today()?' today':'')+(ds===viewDate?' sel':'')+'" ' +
      'onclick="jumpDay(\''+ds+'\')"><b>'+day+'</b><span class="cal-dots">'+dots+'</span></button>';
  }
  h += '</div>';

  h += '<div class="cal-lg">' + PARTS.map(p =>
    '<span><i style="background:'+p.color+'"></i>'+p.name+'</span>').join('') + '</div>';

  h += '<div class="stats" style="margin-top:14px">' +
    '<div class="stat"><b>'+mDays+'</b><span>운동한 날</span></div>' +
    '<div class="stat"><b>'+mSets+'</b><span>총 세트</span></div>' +
    '<div class="stat"><b>'+(mVol>=1000?r1(mVol/1000)+'t':Math.round(mVol))+'</b><span>총 볼륨</span></div></div>';

  /* 그 달의 기록 목록 */
  const days = [];
  for (let day=total; day>=1; day--){
    const ds = iso(new Date(y, m, day));
    if (daySets(ds) || mealsOn(ds).length) days.push(ds);
  }
  h += '<div class="sec">이 달의 기록</div><div class="card">';
  h += days.length ? days.map(dsumRow).join('') : '<div class="empty">기록이 없습니다.</div>';
  return h + '</div>';
}

function dsumRow(ds){
  const info = dayInfo(ds);
  const names = info.sl.map(s => s.exId).join(', ') || '운동 없음';
  return '<button class="dsum" onclick="jumpDay(\''+ds+'\')">' +
    '<span class="dsum-d"><b>'+new Date(ds).getDate()+'일</b><span>'+fmtW(ds)+'</span></span>' +
    '<span class="dsum-t"><b>'+esc(names)+'</b><span>'+
      (info.sets? info.sets+'세트 · '+Math.round(info.vol).toLocaleString()+'kg' : '—') +
      (info.meals? ' · 식단 '+info.kcal+'kcal' : '')+'</span></span>' +
    '<span class="dsum-v">›</span></button>';
}

function recWeek(){
  const start = shift(recAnchor, -((new Date(recAnchor).getDay()+6)%7));  /* 월요일 시작 */
  const days = Array.from({length:7}, (_,i) => shift(start, i));
  const end = days[6];

  const byPart = {}; PARTS.forEach(p => byPart[p.id] = 0);
  let vol = 0, sets = 0, wd = 0, kcalSum = 0, kcalDays = 0, protSum = 0;
  days.forEach(d => {
    const info = dayInfo(d);
    if (info.sets){ wd++; vol += info.vol; sets += info.sets; }
    slotsOn(d).forEach(sl => {
      const ex = EX[sl.exId]; if (!ex) return;
      byPart[ex.part] += setsOf(sl.id).length;
    });
    if (mealsOn(d).length){ kcalDays++; const e = eaten(d); kcalSum += e.kcal; protSum += e.p; }
  });
  const maxP = Math.max(1, ...Object.values(byPart));

  let h = '<div class="cal-h"><button onclick="recMove(-1)">‹</button>' +
    '<b>'+fmtD(start)+' ~ '+fmtD(end)+'</b><button onclick="recMove(1)">›</button></div>';

  const cur = start === weekStart(today());
  h += '<button class="rep-btn" onclick="openWeekReport(\''+start+'\')">' +
    '<span>📋 '+(cur ? '이번 주 중간 점검' : '주간 리포트 보기')+'</span>' +
    '<em>신기록 · 균형 · 다음 주 제안</em></button>';
  h += '<div class="stats">' +
    '<div class="stat"><b>'+wd+'</b><span>운동일</span></div>' +
    '<div class="stat"><b>'+sets+'</b><span>세트</span></div>' +
    '<div class="stat"><b>'+(vol>=1000?r1(vol/1000)+'t':Math.round(vol))+'</b><span>볼륨</span></div></div>';

  h += '<div class="sec">부위별 세트</div><div class="card">';
  PARTS.forEach(p => {
    const v = byPart[p.id];
    const warn = v > 22 ? ' style="color:var(--warn)"' : '';
    h += '<div class="vol"><span class="vol-n">'+p.name+'</span>' +
      '<span class="vol-t"><i style="width:'+(v/maxP*100)+'%;background:'+p.color+'"></i></span>' +
      '<span class="vol-v"'+warn+'>'+v+'세트</span></div>';
  });
  h += '<div class="note">한 부위 주당 10~20세트가 근비대에 적당합니다. 22세트를 넘으면 회복이 따라오기 어려워요.</div></div>';

  if (kcalDays){
    h += '<div class="sec">식단 평균</div><div class="stats">' +
      '<div class="stat"><b>'+Math.round(kcalSum/kcalDays)+'</b><span>일평균 kcal</span></div>' +
      '<div class="stat"><b>'+Math.round(protSum/kcalDays)+'</b><span>일평균 단백질 g</span></div>' +
      '<div class="stat"><b>'+kcalDays+'</b><span>기록한 날</span></div></div>';
  }

  h += '<div class="sec">날짜별</div><div class="card">' +
    days.map(dsumRow).join('') + '</div>';
  return h;
}

function recDay(){
  const d = recAnchor;
  const info = dayInfo(d);
  let h = '<div class="cal-h"><button onclick="recMove(-1)">‹</button>' +
    '<b>'+fmtD(d)+' ('+fmtW(d)+')</b><button onclick="recMove(1)">›</button></div>';

  h += '<div class="stats">' +
    '<div class="stat"><b>'+info.sl.length+'</b><span>종목</span></div>' +
    '<div class="stat"><b>'+info.sets+'</b><span>세트</span></div>' +
    '<div class="stat"><b>'+(info.vol>=1000?r1(info.vol/1000)+'t':Math.round(info.vol))+'</b><span>볼륨</span></div></div>';

  h += '<div class="card">';
  if (!info.sl.length) h += '<div class="empty">이 날 운동 기록이 없습니다.</div>';
  info.sl.forEach(sl => {
    const ex = EX[sl.exId]; if (!ex) return;
    const ss = setsOf(sl.id);
    const v = ss.reduce((a,s) => a+volumeOf(s), 0);
    h += '<div class="dd"><div class="dd-h">' +
      '<i class="dd-c" style="background:'+partOf(ex.part).color+'"></i>' +
      '<b>'+esc(ex.name)+'</b><span>'+(v?Math.round(v).toLocaleString()+'kg':ss.length+'세트')+'</span></div>' +
      '<div class="dd-s">'+ss.map(s => '<i>'+setLabel(s)+(s.rpe?' <small style="opacity:.5">@'+s.rpe+'</small>':'')+'</i>').join('')+'</div></div>';
  });
  h += '</div>';

  const ms = mealsOn(d);
  if (ms.length){
    const e = eaten(d), t = targets();
    h += '<div class="sec">식단</div><div class="card">';
    h += '<div class="stats" style="margin-bottom:12px">' +
      '<div class="stat"><b>'+e.kcal+'</b><span>kcal'+(t?' / '+t.kcal:'')+'</span></div>' +
      '<div class="stat"><b>'+e.p+'</b><span>단백질 g</span></div>' +
      '<div class="stat"><b>'+e.c+'</b><span>탄수 g</span></div></div>';
    MEALTIME.forEach(mt => {
      const list = ms.filter(m => m.time === mt);
      if (!list.length) return;
      h += '<div class="dd"><div class="dd-h"><b>'+mt+'</b><span>' +
        Math.round(list.reduce((a,m) => a+(FOODMAP[m.food]?FOODMAP[m.food].kcal*m.qty:0),0))+' kcal</span></div>' +
        '<div class="dd-s">'+list.map(m => '<i>'+esc(m.food)+(m.qty!==1?' ×'+m.qty:'')+'</i>').join('')+'</div></div>';
    });
    h += '</div>';
  }

  h += '<button class="btn btn-g" onclick="jumpDay(\''+d+'\')">이 날짜에 기록 추가·수정</button>';
  return h;
}

/* ═══════════════════════════════════════════════════
   11-2. 정체 감지 · 디로드 제안
   ───────────────────────────────────────────────────
   "무게가 안 오른다"를 눈으로 세지 말고 숫자로 판정합니다.
   판단 기준은 든 무게가 아니라 추정 1RM 입니다.
   같은 무게로 횟수가 늘었다면 그건 정체가 아니라 성장이니까요.
   ═══════════════════════════════════════════════════ */
function sessionsOf(exId){
  return D.slots.filter(s => s.exId === exId)
    .map(sl => {
      const ss = setsOf(sl.id).filter(x => x.w > 0 && x.r > 0);
      if (!ss.length) return null;
      const top = ss.reduce((a,x) => setE1(x) > setE1(a) ? x : a, ss[0]);
      return { date:sl.date, e:setE1(top), w:top.w, r:top.r,
               vol:ss.reduce((a,x) => a + x.w*x.r, 0), n:ss.length };
    })
    .filter(Boolean)
    .sort((a,b) => a.date.localeCompare(b.date));
}

function stallCheck(exId){
  const ex = EX[exId];
  if (!ex || ex.kind === 'cardio' || ex.kind === 'hold') return null;
  const S = sessionsOf(exId);
  if (S.length < 3) return null;

  const inc = ex.inc || 2.5;
  const recent = S.slice(-Math.min(4, S.length));
  const before = S.slice(0, S.length - recent.length);
  /* 비교할 과거가 없을 수도 있다 (기록이 3~4회뿐인 경우).
     그럴 땐 신기록 여부를 따지지 않고 최근 구간의 추세만으로 판정한다. */
  const bestBefore = before.length ? Math.max(...before.map(x => x.e)) : null;
  const bestRecent = Math.max(...recent.map(x => x.e));
  const noPR = bestBefore === null ? true : bestRecent <= bestBefore * 1.005;
  /* 최근 구간 안에서도 우상향이 없는가 */
  const first = recent[0].e, lastE = recent[recent.length-1].e;
  const drift = (lastE - first) / first;
  const flat = drift < 0.01;
  const down = drift < -0.03;

  if (!(noPR && flat)) return null;

  const n = recent.length;
  const last = S[S.length-1];
  const level = down ? 'hard' : (n >= 4 ? 'hard' : 'soft');
  const deload = roundTo(last.w * 0.85, inc);
  const gap = Math.round((new Date(last.date) - new Date(S[Math.max(0,S.length-n)].date)) / 864e5);

  return {
    ex, n, level, down, last, deload, days:gap,
    bestBefore: bestBefore === null ? null : r1(bestBefore),
    bestRecent: r1(bestRecent),
    drift: Math.round(drift*100)
  };
}

/* ═══════════════════════════════════════════════════
   11-3. 종목별 성장 그래프
   ═══════════════════════════════════════════════════ */
function lineChart(pts, color){
  if (pts.length < 2) return '<div class="empty" style="padding:18px">기록이 2회 이상 쌓이면 그래프가 나옵니다.</div>';
  const W = 320, H = 120, PL = 34, PR = 8, PT = 10, PB = 20;
  const vals = pts.map(p => p.y);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx === mn){ mx += 1; mn -= 1; }
  const pad = (mx-mn)*0.15; mn -= pad; mx += pad;
  const X = i => PL + i/(pts.length-1)*(W-PL-PR);
  const Y = v => PT + (1-(v-mn)/(mx-mn))*(H-PT-PB);

  const line = pts.map((p,i) => (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area = line + ' L'+X(pts.length-1).toFixed(1)+' '+(H-PB)+' L'+X(0).toFixed(1)+' '+(H-PB)+' Z';

  let g = '<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="'+color+'" stop-opacity=".28"/>' +
    '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>';
  [0,0.5,1].forEach(f => {
    const y = PT + f*(H-PT-PB);
    g += '<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    g += '<text class="ch-ax" x="'+(PL-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(mx-f*(mx-mn))+'</text>';
  });
  g += '<path d="'+area+'" fill="url(#cg)"/>';
  g += '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p,i) => {
    g += '<circle class="ch-dot" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.2" stroke="'+color+'"/>';
  });
  g += '<text class="ch-ax" x="'+PL+'" y="'+(H-6)+'">'+pts[0].x+'</text>';
  g += '<text class="ch-ax" x="'+(W-PR)+'" y="'+(H-6)+'" text-anchor="end">'+pts[pts.length-1].x+'</text>';
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg></div>';
}

function openTrend(exId){
  const ex = EX[exId];
  if (!ex){ toast('알 수 없는 종목'); return; }
  const S = sessionsOf(exId);
  const color = partOf(ex.part).color;

  let h = '';
  if (!S.length){
    h = '<div class="empty">아직 기록이 없습니다.</div>';
    openSheet(exId, h); return;
  }

  const show = S.slice(-12);
  const first = S[0], last = S[S.length-1];
  const grow = r1(last.e - first.e);
  const pct = first.e ? Math.round((last.e/first.e-1)*100) : 0;

  h += '<div class="card" style="padding:15px">';
  h += '<div style="display:flex;gap:18px;margin-bottom:4px">' +
    '<div><b style="font-size:22px;font-weight:900;letter-spacing:-.04em">'+Math.round(last.e)+
      '<small style="font-size:11px;color:var(--tx-3)">kg</small></b>' +
      '<span style="display:block;font-size:10px;color:var(--tx-3);font-weight:700;margin-top:2px">최근 추정 1RM</span></div>' +
    '<div><b style="font-size:22px;font-weight:900;letter-spacing:-.04em">'+Math.round(Math.max(...S.map(x=>x.e)))+
      '<small style="font-size:11px;color:var(--tx-3)">kg</small></b>' +
      '<span style="display:block;font-size:10px;color:var(--tx-3);font-weight:700;margin-top:2px">역대 최고</span></div>' +
    '<div><b style="font-size:22px;font-weight:900;letter-spacing:-.04em;color:'+(grow>=0?'var(--good)':'var(--warn)')+'">' +
      (grow>=0?'+':'')+grow+'</b>' +
      '<span style="display:block;font-size:10px;color:var(--tx-3);font-weight:700;margin-top:2px">시작 대비 '+(pct>=0?'+':'')+pct+'%</span></div></div>';
  h += lineChart(show.map(x => ({ x:x.date.slice(5).replace('-','/'), y:Math.round(x.e) })), color);
  h += '<div class="ch-lg"><span><i style="background:'+color+'"></i>세션별 추정 1RM</span></div>';
  h += '<div class="note" style="margin-top:10px">추정 1RM은 그날 가장 강했던 세트로 계산합니다. ' +
       '같은 무게라도 횟수가 늘면 올라가기 때문에, 무게만 볼 때보다 성장을 정확히 잡아냅니다.</div></div>';

  const st = stallCheck(exId);
  if (st){
    h += '<div class="card" style="padding:14px;border-color:rgba(251,146,60,.35);background:rgba(251,146,60,.06)">' +
      '<div style="font-size:13px;font-weight:900;color:#FDBA74;margin-bottom:8px">' +
      (st.down ? '수행능력이 떨어지고 있습니다' : '최근 '+st.n+'세션 정체') + '</div>' +
      '<div class="note" style="margin:0">'+stallAdvice(st)+'</div></div>';
  }

  h += '<div class="grp">세션 기록</div><div class="card">';
  S.slice(-15).reverse().forEach((x,i,arr) => {
    const prev = arr[i+1];
    const dd = prev ? r1(x.e - prev.e) : null;
    h += '<div class="pr-row"><i style="background:'+color+'"></i>' +
      '<b>'+x.date.slice(5).replace('-','/')+' · '+x.w+'kg × '+x.r+'</b>' +
      '<span>'+Math.round(x.e)+'</span>' +
      '<em style="color:'+(dd>0?'var(--good)':dd<0?'var(--warn)':'var(--tx-3)')+'">' +
      (dd===null?'':(dd>0?'+':'')+dd)+'</em></div>';
  });
  h += '</div>';
  openSheet(ex.name, h);
}

function stallAdvice(st){
  const w = st.last.w, inc = st.ex.inc || 2.5;
  if (st.down){
    return '최근 추정 1RM이 <b>'+st.drift+'%</b> 떨어졌어요. 피로가 쌓였거나 회복이 부족하다는 신호입니다.<br><br>' +
      '<b>이번 주는 디로드를 권합니다.</b> '+w+'kg 대신 <b>'+st.deload+'kg</b>로 낮추고, ' +
      '세트 수는 그대로 두되 RPE 6~7에서 멈추세요. 한 주 가볍게 가면 다음 주에 원래 무게가 가벼워집니다.<br><br>' +
      '잠과 식사도 같이 점검해보세요. 무게가 떨어지는 가장 흔한 원인입니다.';
  }
  return '최근 '+st.n+'세션 동안 추정 1RM이 '+st.bestRecent+'kg 근처에 머물러 있어요. 무게를 더 올리기 전에 셋 중 하나를 시도해보세요.<br><br>' +
    '<b>1. 횟수 먼저 늘리기</b> — '+w+'kg에서 지금보다 2회 더 나올 때까지 반복하세요. 무게는 그다음입니다.<br>' +
    '<b>2. 세트 추가</b> — 같은 무게로 한 세트 더. 볼륨이 늘면 다시 오르기 시작합니다.<br>' +
    '<b>3. 디로드</b> — 한 주만 <b>'+st.deload+'kg</b>로 낮췄다가 원래 무게로 복귀. 3주 넘게 막혔다면 이게 제일 빠릅니다.<br><br>' +
    '증량은 '+inc+'kg 단위가 기본이지만, 막혔을 땐 절반씩 올리는 것도 방법이에요.';
}

/* ═══════════════════════════════════════════════════
   11-4. 루틴
   ═══════════════════════════════════════════════════ */
async function saveRoutine(){
  const list = slotsOn(viewDate).map(s => s.exId);
  if (!list.length){ toast('저장할 종목이 없어요'); return; }
  const name = prompt('루틴 이름을 정해주세요', suggestRoutineName(list));
  if (!name) return;
  D.routines = D.routines || [];
  D.routines.push({ id:uid(), name:name.trim(), exIds:list, created:today() });
  await saveData(); render();
  toast('“'+name.trim()+'” 루틴을 저장했어요');
}
function suggestRoutineName(list){
  const cnt = {};
  list.forEach(n => { const e = EX[n]; if (e) cnt[e.part] = (cnt[e.part]||0)+1; });
  const top = Object.keys(cnt).sort((a,b) => cnt[b]-cnt[a]).slice(0,2).map(p => partOf(p).name);
  return top.length ? top.join('·')+' 데이' : '내 루틴';
}
async function applyRoutine(id){
  const rt = (D.routines||[]).find(r => r.id === id);
  if (!rt) return;
  const exist = new Set(slotsOn(viewDate).map(s => s.exId));
  let added = 0;
  rt.exIds.forEach(n => {
    if (!EX[n] || exist.has(n)) return;
    D.slots.push({ id:uid(), date:viewDate, exId:n }); added++;
  });
  await saveData(); closeSheet(); tab = 'workout'; render();
  toast(added ? rt.name+' · '+added+'개 종목 추가' : '이미 다 들어있어요');
}
async function rmRoutine(id){
  if (!confirm('이 루틴을 지울까요? 기록은 남습니다.')) return;
  bury(id);
  D.routines = (D.routines||[]).filter(r => r.id !== id);
  await saveData(); openRoutines();
}
function routineListHTML(compact){
  const R = D.routines || [];
  if (!R.length) return compact ? '' :
    '<div class="empty">저장된 루틴이 없습니다.<br>운동 탭에서 종목을 구성한 뒤 “루틴으로 저장”을 누르세요.</div>';
  return R.map(r =>
    '<div class="rt"><div class="rt-t"><b>'+esc(r.name)+'</b>' +
    '<span>'+r.exIds.length+'종목 · '+esc(r.exIds.slice(0,3).join(', '))+(r.exIds.length>3?' 외':'')+'</span></div>' +
    '<button class="rt-b" onclick="applyRoutine(\''+r.id+'\')">불러오기</button>' +
    (compact ? '' : '<button class="rt-x" onclick="rmRoutine(\''+r.id+'\')" aria-label="삭제">✕</button>') +
    '</div>').join('');
}
function openRoutines(){
  let h = routineListHTML(false);
  h += '<div class="note">루틴을 불러오면 종목만 추가됩니다. 무게·횟수는 그 종목의 지난 기록에서 자동으로 채워져요.</div>';
  openSheet('내 루틴', h);
}

/* ═══════════════════════════════════════════════════
   11-5. 주간 리포트
   ═══════════════════════════════════════════════════ */
function weekStart(d){ return shift(d, -((new Date(d).getDay()+6)%7)); }

function buildWeek(anchor){
  const st = weekStart(anchor);
  const days = Array.from({length:7}, (_,i) => shift(st,i));
  const pst = shift(st,-7);
  const pdays = Array.from({length:7}, (_,i) => shift(pst,i));

  const agg = ds => {
    let vol=0, sets=0, wd=0;
    const parts={}; PARTS.forEach(p => parts[p.id]=0);
    let kcal=0, prot=0, mdays=0, hitP=0;
    const t = targets();
    ds.forEach(d => {
      const sc = daySets(d);
      if (sc){ wd++; sets += sc; vol += dayVolume(d); }
      slotsOn(d).forEach(sl => { const e=EX[sl.exId]; if(e) parts[e.part] += setsOf(sl.id).length; });
      if (mealsOn(d).length){ const e=eaten(d); mdays++; kcal+=e.kcal; prot+=e.p; if(t && e.p>=t.p*0.9) hitP++; }
    });
    return { vol, sets, wd, parts, kcal, prot, mdays, hitP };
  };
  /* 진행 중인 주라면 지난주도 같은 일수만큼만 잘라서 비교한다.
     월요일에 지난주 7일치와 비교하면 항상 "폭락"으로 보이기 때문. */
  const isNow = st === weekStart(today());
  const elapsed = isNow
    ? Math.min(7, Math.round((new Date(today()) - new Date(st))/864e5) + 1)
    : 7;
  const now = agg(days.slice(0, elapsed)), prev = agg(pdays.slice(0, elapsed));

  /* 이번 주 신기록 */
  const prs = [];
  const runBest = {};
  const sd = {}; D.slots.forEach(x => sd[x.id] = x.date);
  D.sets.forEach(x => {
    const dt = sd[x.slotId]; if (!dt || !x.w) return;
    if (runBest[x.exId] === undefined){ runBest[x.exId] = x.w; return; }
    if (x.w > runBest[x.exId]){
      runBest[x.exId] = x.w;
      if (dt >= st && dt <= days[6]) prs.push({ ex:x.exId, w:x.w, r:x.r, date:dt });
    }
  });

  /* 정체 종목 */
  const exThisWeek = [...new Set(D.slots.filter(x => x.date >= st && x.date <= days[6]).map(x => x.exId))];
  const stalls = exThisWeek.map(stallCheck).filter(Boolean);

  return { st, end:days[6], days, now, prev, prs, stalls, isNow, elapsed,
           empty: now.wd === 0 && now.mdays === 0 };
}

function openWeekReport(anchor){
  const R = buildWeek(anchor || viewDate);
  const n = R.now, pv = R.prev;
  const t = targets();

  if (R.empty){
    openSheet('주간 리포트', '<div class="empty">이 주에는 기록이 없습니다.<br>운동이나 식단을 기록하면 리포트가 만들어져요.</div>');
    return;
  }

  const cmp = (a,b,unit,inv) => {
    if (!b) return '<span class="rep-cmp">지난주 기록 없음</span>';
    const d = Math.round((a/b-1)*100);
    if (Math.abs(d) < 3) return '<span class="rep-cmp">지난주와 비슷</span>';
    const good = inv ? d < 0 : d > 0;
    return '<span class="rep-cmp '+(good?'rep-up':'rep-dn')+'">'+(d>0?'▲':'▼')+' 지난주 대비 '+Math.abs(d)+'%</span>';
  };

  let h = '<div class="rep-hero"><div class="rh-l">'+fmtD(R.st)+' ~ '+fmtD(R.end)+
      (R.isNow ? ' · 진행 중 '+R.elapsed+'일차' : '')+'</div>' +
    '<div class="rh-n">'+(n.vol>=1000 ? r1(n.vol/1000)+'t' : Math.round(n.vol)+'kg')+'</div>' +
    '<div class="rh-s">'+n.wd+'일 운동 · '+n.sets+'세트</div>' +
    cmp(n.vol, pv.vol) +
    (R.isNow ? '<div class="note" style="margin-top:7px">지난주 같은 요일까지와 비교한 값입니다.</div>' : '') +
    '</div>';

  /* 부위 균형 */
  const maxP = Math.max(1, ...Object.values(n.parts));
  h += '<div class="grp">부위별 세트</div><div class="card">';
  PARTS.forEach(p => {
    const v = n.parts[p.id];
    const c = v > 22 ? 'var(--warn)' : v === 0 ? 'var(--tx-3)' : 'var(--tx-3)';
    h += '<div class="vol"><span class="vol-n">'+p.name+'</span>' +
      '<span class="vol-t"><i style="width:'+(v/maxP*100)+'%;background:'+p.color+'"></i></span>' +
      '<span class="vol-v" style="color:'+c+'">'+v+'</span></div>';
  });
  h += '</div>';

  /* 이번 주 하이라이트 */
  h += '<div class="grp">'+(R.isNow ? '여기까지' : '하이라이트')+'</div><div class="card">';
  if (R.prs.length){
    R.prs.slice(0,6).forEach(x => {
      h += '<div class="rep-li"><i>🏆</i><span><b>'+esc(x.ex)+'</b> 신기록 — '+x.w+'kg × '+x.r+'</span></div>';
    });
  } else {
    h += '<div class="rep-li"><i>📊</i><span>'+(R.isNow?'아직':'이 주엔')+' 중량 신기록이 없어요. 같은 무게로 횟수가 늘었다면 그것도 성장입니다.</span></div>';
  }
  if (n.wd >= 4) h += '<div class="rep-li"><i>🔥</i><span><b>'+n.wd+'일</b> 운동했어요. 좋은 페이스입니다.</span></div>';
  else if (n.wd <= 2 && (!R.isNow || R.elapsed >= 5))
    h += '<div class="rep-li"><i>👀</i><span>운동 <b>'+n.wd+'일</b>. 주 3회는 넘겨야 근육이 자랍니다.</span></div>';
  else if (R.isNow) h += '<div class="rep-li"><i>📅</i><span>아직 '+R.elapsed+'일차예요. 주 3~4회를 목표로 가봅시다.</span></div>';

  if (pv.vol && n.vol > pv.vol*1.4)
    h += '<div class="rep-li"><i>⚠️</i><span>볼륨이 지난주보다 <b>'+Math.round((n.vol/pv.vol-1)*100)+'%</b> 늘었어요. 부상 위험 구간입니다.</span></div>';
  const over = PARTS.filter(p => n.parts[p.id] > 22);
  if (over.length) h += '<div class="rep-li"><i>📊</i><span><b>'+over[0].name+'</b>'+josa(over[0].name,'이','가')+' '+n.parts[over[0].id]+'세트. 20세트 아래로 줄이는 걸 권합니다.</span></div>';
  const zero = PARTS.filter(p => p.id !== 'cardio' && n.parts[p.id] === 0);
  if (n.wd >= 3 && zero.length && zero.length <= 4){
    const zn = zero.map(z => z.name).join('·');
    h += '<div class="rep-li"><i>🦵</i><span><b>'+zn+'</b>'+josa(zn,'이','가')+' 0세트예요. 다음 주에 넣어보세요.</span></div>';
  }
  h += '</div>';

  /* 식단 */
  if (n.mdays){
    h += '<div class="grp">식단</div><div class="card">';
    h += '<div class="stats" style="margin-bottom:11px">' +
      '<div class="stat"><b>'+Math.round(n.kcal/n.mdays)+'</b><span>일평균 kcal</span></div>' +
      '<div class="stat"><b>'+Math.round(n.prot/n.mdays)+'</b><span>일평균 단백질</span></div>' +
      '<div class="stat"><b>'+n.hitP+'/'+n.mdays+'</b><span>단백질 달성</span></div></div>';
    if (t){
      const avg = n.kcal/n.mdays, gap = Math.round(avg - t.kcal);
      if (Math.abs(gap) <= 150) h += '<div class="rep-li"><i>🎯</i><span>목표 칼로리에 잘 맞췄어요. 이대로 유지하세요.</span></div>';
      else if (gap > 150) h += '<div class="rep-li"><i>🍩</i><span>목표보다 하루 평균 <b>'+gap+'kcal</b> 더 먹었어요.</span></div>';
      else h += '<div class="rep-li"><i>🥺</i><span>목표보다 하루 평균 <b>'+Math.abs(gap)+'kcal</b> 적게 먹었어요. 너무 줄이면 근육부터 빠집니다.</span></div>';
      if (n.hitP < n.mdays*0.6) h += '<div class="rep-li"><i>🍗</i><span>단백질 목표를 채운 날이 <b>'+n.hitP+'일</b>뿐이에요. 한 끼에 한 가지 단백질을 정해두면 쉬워집니다.</span></div>';
    }
    if (n.mdays < 5) h += '<div class="rep-li"><i>📝</i><span>식단을 기록한 날이 <b>'+n.mdays+'일</b>이에요. 기록해야 조언할 수 있어요.</span></div>';
    h += '</div>';
  }

  /* 정체 */
  if (R.stalls.length){
    h += '<div class="grp">막힌 종목</div><div class="card">';
    R.stalls.slice(0,4).forEach(st => {
      h += '<div class="rep-li"><i>'+(st.down?'📉':'⏸')+'</i><span><b>'+esc(st.ex.name)+'</b> — ' +
        (st.down ? '수행능력 하락' : st.n+'세션 정체') + '. ' +
        '<button class="tmr-b" style="padding:3px 7px;font-size:10.5px;margin-left:2px" onclick="openTrend(\''+q(st.ex.name)+'\')">해법 보기</button></span></div>';
    });
    h += '</div>';
  }

  /* 다음 주 제안 */
  h += '<div class="grp">다음 주 제안</div><div class="card"><div class="note" style="margin:0">'+nextWeekPlan(R)+'</div></div>';

  openSheet('주간 리포트', h);
  if (D.lastReport !== R.st){ D.lastReport = R.st; saveData(); }
}

function nextWeekPlan(R){
  const n = R.now, pv = R.prev;
  const out = [];
  if (n.wd === 0) return R.isNow
    ? '아직 이번 주 운동 기록이 없어요. 오늘 <b>가벼운 것 하나</b>만 해도 한 주의 방향이 달라집니다.'
    : '이번 주는 운동 기록이 없었어요. 다음 주는 <b>딱 2회</b>만 목표로 잡아보세요. 다시 시작하는 게 제일 어렵습니다.';
  if (n.wd <= 2 && !R.isNow) out.push('운동 횟수를 <b>주 3~4회</b>로 늘려보세요. 한 번에 오래 하는 것보다 자주 하는 쪽이 효과적입니다.');
  if (pv.vol && n.vol > pv.vol*1.4) out.push('볼륨이 급하게 올랐으니 다음 주는 <b>이번 주와 비슷한 수준</b>으로 유지하세요. 늘릴 땐 주당 10% 이내가 안전합니다.');
  else if (pv.vol && n.vol < pv.vol*0.7 && n.wd >= 3) out.push('볼륨이 줄었어요. 세트를 하나씩만 더 붙여도 충분합니다.');
  const zero = PARTS.filter(p => p.id !== 'cardio' && n.parts[p.id] === 0);
  if (zero.length && zero.length <= 4) out.push('<b>'+zero.map(z=>z.name).join('·')+'</b> 운동을 하루 넣어보세요.');
  if (R.stalls.length) out.push('막힌 종목이 '+R.stalls.length+'개 있어요. <b>무게를 올리기 전에 횟수를 2회 더</b> 채우는 쪽을 먼저 시도하세요.');
  if (!R.prs.length && n.wd >= 3) out.push('신기록이 없었다면 <b>같은 무게에서 횟수 1회 더</b>를 다음 주 목표로 잡으세요. 그게 다음 증량의 신호입니다.');
  if (!out.length) out.push('균형 잡힌 한 주였어요. 지금 페이스를 유지하면서 <b>가장 자신 있는 종목 하나만 2.5kg 올려보세요.</b>');
  return out.slice(0,4).map((x,i) => (i+1)+'. '+x).join('<br><br>');
}

const STAGES = [
  { exp:0, name:'아깽이', sw:14, arm:4.0, bi:0, pose:'down' },
  { exp:80, name:'뉴비냥', sw:17, arm:5.5, bi:2.5, pose:'down' },
  { exp:220, name:'헬린이냥', sw:21, arm:7.0, bi:4.0, pose:'down' },
  { exp:450, name:'머슬냥', sw:25, arm:9.0, bi:5.5, pose:'flex' },
  { exp:800, name:'벌크냥', sw:29, arm:11.0, bi:7.0, pose:'flex' },
  { exp:1300, name:'괴물냥', sw:33, arm:13.0, bi:8.5, pose:'flex' }
];

function catStats(){
  const sd = {}; D.slots.forEach(s => sd[s.id] = s.date);
  const day = {};
  const touch = d => (day[d] = day[d] || { sets:0, vol:0, pr:0, meals:0 });
  const rb = {};
  D.sets.forEach(s => {
    const d = sd[s.slotId]; if (!d) return;
    const o = touch(d); o.sets++; o.vol += volumeOf(s);
    if (s.w > 0){
      if (rb[s.exId] === undefined) rb[s.exId] = s.w;
      else if (s.w > rb[s.exId]){ rb[s.exId] = s.w; o.pr++; }
    }
  });
  D.meals.forEach(m => touch(m.date).meals++);

  const t = targets();
  let exp = 0;
  Object.keys(day).forEach(d => {
    const o = day[d]; let e = 0;
    if (o.sets > 0) e += 10;
    if (o.vol >= 3000) e += 5;
    if (o.meals >= 3) e += 8;
    if (t && eaten(d).p >= t.p*0.9) e += 7;
    e += o.pr*15;
    exp += e;
  });

  let idx = 0;
  for (let i=0;i<STAGES.length;i++) if (exp >= STAGES[i].exp) idx = i;
  const cur = STAGES[idx], nxt = STAGES[idx+1] || null;
  const pct = nxt ? Math.min(100,(exp-cur.exp)/(nxt.exp-cur.exp)*100) : 100;

  const has = d => day[d] && day[d].sets > 0;
  let streak = 0; const c0 = new Date(today());
  if (!has(today())) c0.setDate(c0.getDate()-1);
  while (has(iso(c0))){ streak++; c0.setDate(c0.getDate()-1); }
  let noRest = 0; const c2 = new Date(today());
  while (has(iso(c2))){ noRest++; c2.setDate(c2.getDate()-1); }

  const wdays = Object.keys(day).filter(has).sort();
  const last = wdays[wdays.length-1] || null;
  const since = last ? Math.round((new Date(today())-new Date(last))/864e5) : null;

  const ago = k => shift(today(), -k);
  let volNow = 0, volPrev = 0;
  Object.keys(day).forEach(d => {
    if (d > ago(7)) volNow += day[d].vol; else if (d > ago(14)) volPrev += day[d].vol;
  });
  const partSets = {}; PARTS.forEach(p => partSets[p.id] = 0);
  D.slots.filter(s => s.date > ago(7)).forEach(sl => {
    const ex = EX[sl.exId]; if (ex) partSets[ex.part] += setsOf(sl.id).length;
  });
  return { exp, idx, cur, nxt, pct, streak, noRest, since, day, volNow, volPrev,
           partSets, totalDays: wdays.length };
}

    flex:'<path d="M41.4 29.6 l6.4 2.6 -6.4 2.6 M58.6 29.6 l-6.4 2.6 6.4 2.6" fill="none" stroke="'+DARK+'" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>'
  }[mood] || '';
  g += '<path d="M50 35.8 l-2.3 -2 h4.6 Z" fill="'+PINK+'"/>';

    ? '<path d="M44.8 38.4 q5.2 6.2 10.4 0 Z" fill="'+DARK+'"/><path d="M47.6 41.6 q2.4 1.6 4.8 0 q-2.4 2.4 -4.8 0 Z" fill="'+PINK+'"/>'
    : mood === 'sad'

function catMood(st){
  if (st.since !== null && st.since >= 3) return 'sad';
  if (st.noRest >= 6) return 'worry';
  if (st.volPrev > 0 && st.volNow > st.volPrev*1.4) return 'worry';
  if (st.streak >= 3) return 'happy';
  if (st.day[today()] && st.day[today()].sets > 0) return st.idx >= 3 ? 'flex' : 'happy';
  return 'normal';
}

function catSay(st){
  const out = [], d = today();
  const tSet = st.day[d] ? st.day[d].sets : 0;
  const t = targets(), e = t ? eaten(d) : null;
  const mc = mealsOn(d).length;

  if (st.noRest >= 6) out.push({i:'😾',tone:'a',t:'<b>'+st.noRest+'일 연속</b> 운동했다냥. 근육은 쉴 때 자란다냥. 내일은 쉬자냥.'});
  if (st.volPrev > 0 && st.volNow > st.volPrev*1.4)
    out.push({i:'⚠️',tone:'a',t:'이번주 볼륨이 지난주보다 <b>'+Math.round((st.volNow/st.volPrev-1)*100)+'%</b> 늘었다냥. 부상이 나는 구간이라냥.'});

  slotsOn(d).forEach(sl => {
    const a = prAnalysis(sl); if (!a) return;
    if (a.verdict === 'go') out.push({i:'🔥',tone:'g',t:'<b>'+a.ex.name+'</b> 추정 1RM이 '+a.topE+'kg다냥! <b>'+a.ladder[0]+'kg</b>부터 도전각이다냥.'});
    else if (a.verdict === 'wait') out.push({i:'✋',tone:'a',t:'<b>'+a.ex.name+'</b> 수치는 PR급인데 지금은 지쳤다냥. 다음에 첫 종목으로 하자냥.'});
  });

  if (t && e){
    const left = t.p - e.p;
    if (mc > 0 && left > 25) out.push({i:'🍗',tone:'',t:'단백질이 <b>'+e.p+'g</b>이다냥. '+left+'g 남았어냥 — 닭가슴살 한 팩 23g, 프로틴 한 스쿱 24g이라냥.'});
    else if (mc > 0 && left <= 0) out.push({i:'💪',tone:'g',t:'단백질 <b>'+e.p+'g</b> 채웠다냥! 오늘 근육은 안심이라냥.'});
    const over = e.kcal - t.kcal;
    if (over > 300) out.push({i:'🍩',tone:'',t:'목표보다 <b>'+over+'kcal</b> 더 먹었다냥. 하루로 무너지진 않는다냥.'});
    else if (mc >= 3 && over < -500 && new Date().getHours() >= 20)
      out.push({i:'🥺',tone:'a',t:'오늘 <b>'+Math.abs(over)+'kcal</b>나 덜 먹었다냥. 너무 굶으면 근육부터 빠진다냥.'});
    if (mc === 0 && tSet > 0) out.push({i:'🍚',tone:'',t:'운동은 했는데 식단이 비었다냥. 기록해야 도와줄 수 있다냥.'});
  } else if (!t){
    out.push({i:'📋',tone:'',t:'아직 네 정보를 모른다냥. 내 정보 탭에서 키·몸무게를 알려주라냥.'});
  }

  /* 지난주 리포트가 아직 안 열렸다면 (월·화요일에 알림) */
  const dow = new Date(d).getDay();
  const lastWeek = weekStart(shift(d,-7));
  if ((dow === 1 || dow === 2 || dow === 0) && D.lastReport !== lastWeek &&
      D.slots.some(x => x.date >= lastWeek && x.date < weekStart(d))){
    out.push({i:'📋',tone:'g',t:'지난주 리포트가 나왔다냥! <b>기록실 → 주</b>에서 볼 수 있다냥.'});
  }

  /* 정체 종목 */
  const stalled = [...new Set(D.slots.filter(x => x.date > shift(d,-21)).map(x => x.exId))]
    .map(stallCheck).filter(Boolean);
  if (stalled.length){
    const s0 = stalled.find(x => x.down) || stalled[0];
    out.push({i: s0.down ? '📉' : '⏸', tone:'a',
      t: s0.down
        ? '<b>'+s0.ex.name+'</b> 무게가 떨어지고 있다냥. 이번 주는 <b>'+s0.deload+'kg</b>로 낮춰서 가자냥.'
        : '<b>'+s0.ex.name+'</b>이 '+s0.n+'세션째 제자리다냥. 무게 올리기 전에 횟수를 2회 더 채워보라냥.'});
  }

  const strong = PARTS.filter(p => p.id !== 'cardio' && st.partSets[p.id] > 22);
  const weak = PARTS.filter(p => p.id !== 'cardio' && st.partSets[p.id] === 0);
  if (strong.length) out.push({i:'📊',tone:'a',t:'이번주 <b>'+strong[0].name+'</b>'+josa(strong[0].name,'이','가')+' '+st.partSets[strong[0].id]+'세트라냥. 회복이 안 따라온다냥.'});
  if (st.totalDays >= 4 && weak.length && weak.length <= 3){
    const wn = weak.map(w => w.name).join('·');
    out.push({i:'🦵',tone:'',t:'이번주 <b>'+wn+'</b>'+josa(wn,'이','가')+' 0세트다냥. 한쪽만 크면 이상해진다냥.'});
  }

  if (st.since !== null && st.since >= 3) out.push({i:'😿',tone:'a',t:'<b>'+st.since+'일째</b> 안 왔다냥... 가볍게라도 오자냥.'});
  else if (st.streak >= 3) out.push({i:'🔥',tone:'g',t:'<b>'+st.streak+'일 연속</b> 기록 중이다냥! 곧 '+(st.nxt?st.nxt.name:'최종 단계')+'이다냥.'});
  else if (tSet === 0) out.push({i:'👀',tone:'',t:'오늘은 아직 기록이 없다냥. 종목 하나만 눌러도 시작이다냥.'});

  out.push({i:'💡',tone:'',t:TIPS[Math.floor(new Date(d).getTime()/864e5) % TIPS.length]});
  return out;
}

function openCat(){
  const st = catStats(), mood = catMood(st);
  let h = '<div class="cs-t"><div class="cs-a">'+catSVG(st.idx,mood)+'</div>' +
    '<div class="cs-x"><b>'+st.cur.name+'</b><span>LV '+(st.idx+1)+' · '+st.exp+' EXP' +
    (st.nxt?' · 다음까지 '+(st.nxt.exp-st.exp):'')+'</span>' +
    '<div class="grow-b" style="margin:8px 0 0"><i style="width:'+st.pct+'%"></i></div></div></div>';
  catSay(st).forEach(s => {
    h += '<div class="say '+s.tone+'"><span class="say-i">'+s.i+'</span><span class="say-t">'+s.t+'</span></div>';
  });
  openSheet('헬냥이', h);
}

let bubbleShown = false;
function renderCat(){
  const st = catStats(), mood = catMood(st);
  let lv = null;
  if (st.idx > (D.seenStage||0)){ lv = st.cur.name; D.seenStage = st.idx; saveData(); }
  const says = catSay(st);
  const urgent = says.some(s => s.tone === 'a');
  $('#catFab').innerHTML = catSVG(st.idx, lv?'flex':mood) + ((urgent||lv)?'<span class="cat-dot"></span>':'');
  const b = $('#catBB');
  if (lv){
    b.innerHTML = '<span class="cb-t">LEVEL UP</span>진화했다냥!! 이제 <b>'+lv+'</b>이다냥 🎉';
    b.classList.add('on'); bubbleShown = true;
    setTimeout(() => b.classList.remove('on'), 11000);
  } else if (!bubbleShown && says.length){
    b.innerHTML = '<span class="cb-t">헬냥이</span>'+says[0].t;
    b.classList.add('on'); bubbleShown = true;
    setTimeout(() => b.classList.remove('on'), 9000);
  }
}

  if (p){
    const t = targets();
    h += '<div class="stats" style="margin-bottom:11px">' +
      '<div class="stat"><b>'+p.kg+'</b><span>몸무게 kg</span></div>' +
      '<div class="stat"><b>'+t.kcal+'</b><span>목표 kcal</span></div>' +
      '<div class="stat"><b>'+t.p+'</b><span>단백질 g</span></div></div>';
    h += '<div class="note" style="margin:0 0 12px">' +
      ({m:'남성',f:'여성'}[p.sex])+' · '+p.age+'세 · '+p.cm+'cm · ' +
      ({cut:'체지방 감량',keep:'유지',bulk:'근육량 증가'}[p.goal])+' · 유지 칼로리 '+t.tdee+'kcal</div>';
  } else {
    h += '<div class="empty" style="padding:14px">아직 정보가 없습니다.</div>';
  }
  h += '<button class="btn btn-g btn-sm" onclick="openProfile()">'+(p?'정보 수정':'정보 입력')+'</button></div>';

  /* 체중 추이 */
  const W = (D.weights||[]).slice().sort((a,b) => a.date.localeCompare(b.date));
  if (W.length >= 2){
    const vals = W.map(w => w.kg);
    const mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx-mn)||1;
    const pts = W.map((w,i) => (i/(W.length-1)*100)+','+(38-(w.kg-mn)/rng*34)).join(' ');
    const diff = r1(vals[vals.length-1]-vals[0]);
    h += '<div class="sec">체중 변화</div><div class="card"><div class="wt">' +
      '<div class="wt-n"><b>'+vals[vals.length-1]+'</b><span>kg · 시작 대비 '+(diff>0?'+':'')+diff+'</span></div>' +
      '<div class="wt-g"><svg viewBox="0 0 100 42" preserveAspectRatio="none">' +
      '<polyline points="'+pts+'" fill="none" stroke="'+(diff<=0?'var(--good)':'var(--warn)')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div></div>' +
      '<div class="note">기록 '+W.length+'회 · '+fmtD(W[0].date)+' ~ '+fmtD(W[W.length-1].date)+'</div></div>';
  }

  /* 종목별 최고 */
  const best = {};
  D.slots.forEach(sl => setsOf(sl.id).forEach(s => {
    if (!s.w) return;
    const e = setE1(s);
    if (!best[sl.exId] || s.w > best[sl.exId].w) best[sl.exId] = Object.assign({}, best[sl.exId], { w:s.w });
    if (!best[sl.exId] || e > (best[sl.exId].e||0)) best[sl.exId] = Object.assign({ w:s.w }, best[sl.exId], { e:Math.max(e, best[sl.exId].e||0) });
  }));
  const keys = Object.keys(best).sort((a,b) => best[b].w - best[a].w);
  h += '<div class="sec">종목별 최고 기록</div><div class="card">';
  if (!keys.length) h += '<div class="empty">기록이 쌓이면 나타납니다.</div>';
  else h += '<div class="note" style="margin:0 0 6px">종목을 누르면 성장 그래프가 열립니다.</div>';
  keys.slice(0,25).forEach(k => {
    const ex = EX[k]; if (!ex) return;
    h += '<div class="pr-row" style="cursor:pointer" onclick="openTrend(\''+q(k)+'\')">' +
      '<i style="background:'+partOf(ex.part).color+'"></i>' +
      '<b>'+esc(k)+'</b><span>'+best[k].w+'kg</span>' +
      '<em>'+(best[k].e ? '1RM '+Math.round(best[k].e) : '')+'</em></div>';
  });
  h += '</div>';

  /* 데이터 */
  h += '<div class="sec">데이터</div><div class="card">' +
    '<div class="note" style="margin:0 0 12px">기록은 이 기기 안에만 저장됩니다. ' +
    '브라우저 데이터를 지우거나 기기를 바꾸면 사라지니 가끔 백업하세요.</div>' +
    '<div class="row2"><button class="btn btn-g btn-sm" onclick="exportData()">백업 내려받기</button>' +
    '<button class="btn btn-g btn-sm" onclick="importData()">백업 복원</button></div>' +
    '<button class="btn btn-g btn-sm" style="margin-top:8px" onclick="openRoutines()">루틴 관리</button>' +
    '<button class="btn btn-g btn-sm" style="margin-top:8px" onclick="openCustomList()">내가 추가한 종목·음식</button>' +
    '<button class="btn btn-g btn-sm" style="margin-top:8px;color:var(--chest)" onclick="wipe()">기록 전체 삭제</button></div>';

  h += '<div class="note" style="text-align:center;margin-top:16px">IRONLOG v3 · 종목 '+
       Object.keys(EX).length+'개 · 음식 '+Object.keys(FOODMAP).length+'개</div>';
  return h;
}

function big3HTML(){
  const L = [{k:'백스쿼트',s:'스쿼트'},{k:'벤치프레스',s:'벤치'},{k:'데드리프트',s:'데드'}];
  const rows = L.map(l => {
    let w = 0, e = 0;
    D.slots.filter(s => s.exId === l.k).forEach(sl => setsOf(sl.id).forEach(s => {
      if (s.w > w) w = s.w;
      const v = setE1(s); if (v > e) e = v;
    }));
    return { s:l.s, w, e:Math.round(e) };
  });
  if (!rows.some(r => r.e)) return '';
  const total = rows.reduce((a,r) => a+r.e, 0);
  const next = Math.ceil((total+1)/100)*100;
  const pct = Math.min(100, (total-(next-100))/100*100);

  let dots = null;
  const p = D.profile;
  if (p && p.kg){
    const K = p.sex === 'f'
      ? [-57.96288,13.6175032,-0.1126655495,0.0005158568,-0.0000010706]
      : [-307.75076,24.0900756,-0.1918759221,0.0007391293,-0.000001093];
    const bw = Math.min(Math.max(p.kg,40),210);
    const den = K[0]+K[1]*bw+K[2]*bw**2+K[3]*bw**3+K[4]*bw**4;
    if (den > 0) dots = Math.round(total*500/den);
  }
  let h = '<div class="big3"><div class="big3-t"><span>3대 · 추정 1RM 합계</span>' +
    (dots?'<em>DOTS '+dots+'</em>':'')+'</div>';
  h += '<div class="big3-n">'+total+'<small> kg</small></div>';
  h += '<div class="big3-r">'+rows.map(r =>
    '<div class="big3-c"><span>'+r.s+'</span><b>'+(r.e||'–')+'</b><i>'+(r.w?'실제 '+r.w+'kg':'기록 없음')+'</i></div>').join('')+'</div>';
  h += '<div class="big3-p"><i style="width:'+pct+'%"></i></div>';
  h += '<div class="big3-f">3대 '+next+'까지 <b style="color:var(--tx)">'+(next-total)+'kg</b> 남았어요.</div></div>';
  return h;
}

function editSet(id){
  const s = D.sets.find(x => x.id === id); if (!s) return;
  const ex = EX[s.exId] || {};
  shState = { editId:id };
  let h = '<div class="note" style="margin:0 0 13px">'+esc(s.exId)+'</div><div class="pf">';
  if (ex.kind === 'cardio'){
    h += '<div><label>시간 (분)</label><input id="eA" inputmode="decimal" value="'+(s.min||0)+'"></div>' +
         '<div><label>거리 (km)</label><input id="eB" inputmode="decimal" value="'+(s.dist||0)+'"></div>';
  } else if (ex.kind === 'hold'){
    h += '<div class="pf-w"><label>시간 (초)</label><input id="eA" inputmode="numeric" value="'+(s.sec||0)+'"></div>';
  } else {
    h += '<div><label>중량 (kg)</label><input id="eA" inputmode="decimal" value="'+(s.w||0)+'"></div>' +
         '<div><label>횟수</label><input id="eB" inputmode="numeric" value="'+(s.r||0)+'"></div>';
  }
  if (ex.kind !== 'cardio'){
    h += '<div class="pf-w"><label>RPE</label><select id="eR">' +
      ['','6','7','8','9','10'].map(v => '<option value="'+v+'"'+(String(s.rpe||'')===v?' selected':'')+'>'+(v||'없음')+'</option>').join('') +
      '</select></div>';
  }
  h += '</div><button class="btn" onclick="saveEdit()">저장</button>' +
    '<button class="btn btn-g btn-sm" style="margin-top:8px;color:var(--chest)" onclick="rmSet(\''+id+'\',1)">이 세트 삭제</button>';

}
async function saveEdit(){
  const s = D.sets.find(x => x.id === shState.editId); if (!s) return;
  const ex = EX[s.exId] || {};
  const A = $('#eA') ? num($('#eA').value) : 0;
  const B = $('#eB') ? num($('#eB').value) : 0;
  if (ex.kind === 'cardio'){ s.min = A; s.dist = B; }
  else if (ex.kind === 'hold'){ s.sec = A; }
  else {
    if (B <= 0){ toast('횟수를 확인해주세요'); return; }
    s.w = A; s.r = B;
  }
  const rr = $('#eR'); if (rr) s.rpe = rr.value ? parseInt(rr.value,10) : null;
  await saveData(); closeSheet(); render(); toast('수정했어요');
}

/* ── PR 상세 ── */
function openPR(slotId){
  const sl = D.slots.find(s => s.id === slotId); if (!sl) return;
  const a = prAnalysis(sl); if (!a) return;
  const head = a.verdict==='go' ? '🔥 PR 갱신을 도전해볼 만합니다'
    : a.verdict==='wait' ? '⏸ 기록은 나왔지만, 오늘은 참으세요'
    : (a.need.short < 0.5 ? '📊 역대 최고와 같은 수준입니다'
                          : '📈 PR까지 '+a.need.short+'kg 남았습니다');

  let h = '<div class="card" style="padding:15px"><div style="font-size:14px;font-weight:900;margin-bottom:12px">'+head+'</div>';
  h += '<div style="display:flex;gap:18px;margin-bottom:11px">' +
    '<div><b style="font-size:21px;font-weight:900;letter-spacing:-.035em">'+a.topE+'<small style="font-size:11px;color:var(--tx-3)">kg</small></b>' +
    '<span style="display:block;font-size:10px;color:var(--tx-3);font-weight:700;margin-top:2px">오늘 추정 1RM</span></div>' +
    '<div><b style="font-size:21px;font-weight:900;letter-spacing:-.035em">'+a.pr+'<small style="font-size:11px;color:var(--tx-3)">kg</small></b>' +

async function addSet(slotId){
  const sl = D.slots.find(s => s.id === slotId); if (!sl) return;
  const ex = EX[sl.exId]; const d = draft[slotId];
  let pr = false;

  if (ex.kind === 'cardio'){
    if (!d.min && !d.dist){ toast('시간이나 거리를 입력해주세요'); return; }
    D.sets.push({ id:uid(), slotId, exId:sl.exId, min:num(d.min), dist:num(d.dist) });
  } else if (ex.kind === 'hold'){
    if (!d.sec){ toast('시간을 입력해주세요'); return; }
    D.sets.push({ id:uid(), slotId, exId:sl.exId, sec:num(d.sec), rpe:d.rpe });
  } else {
    if (!d.r || d.r <= 0){ toast('횟수를 입력해주세요'); return; }
    const before = bestOf(sl.exId);
    D.sets.push({ id:uid(), slotId, exId:sl.exId, w:num(d.w), r:num(d.r), rpe:d.rpe });
    pr = num(d.w) > before && before > 0;
  }
  flashId = D.sets[D.sets.length-1].id;
  await saveData(); render();
  setTimeout(() => { flashId = null; }, 900);

  /* 오늘 기록일 때만 휴식 타이머 자동 시작 */
  if (viewDate === today()){
    const rest = defaultRest(ex.name);
    if (rest) startRest(rest, ex.name);
  }
  vibrate(30);
  toast(pr ? '개인 최고 기록!' : '기록했어요');
}

}
