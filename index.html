/* 주소창에 남은 로그인 실패 사유를 읽어서 알려준다.
   조용히 삼키면 "그냥 앱만 뜬다"로 보여서 원인을 알 수 없다. */
function readAuthError(){
  const h = (location.hash || '').replace(/^#/, '');
  const q = (location.search || '').replace(/^\?/, '');
  const p = new URLSearchParams(h || q);
  const code = p.get('error_code') || p.get('error');
  if (!code) return null;
  const desc = (p.get('error_description') || '').replace(/\+/g, ' ');
  history.replaceState(null, '', location.pathname);
  const map = {
    otp_expired: '로그인 링크가 만료됐어요. 메일을 여러 번 요청하면 이전 링크는 무효가 됩니다. 가장 마지막 메일의 링크를 쓰세요.',
    access_denied: '로그인이 거부됐어요. 링크가 이미 사용됐거나 만료된 경우입니다.',
    invalid_request: '주소 설정이 맞지 않아요. Supabase의 Redirect URLs를 확인해주세요.'
  };
  return map[code] || ('로그인 실패: ' + code + (desc ? ' — ' + decodeURIComponent(desc) : ''));
}

async function initCloud(){
  if (!cloudOn()) return;
  const authErr = readAuthError();
  if (authErr) setTimeout(() => { openLogin(); refresh(loginErrHTML(authErr)); }, 600);
  try{
    const m = await import('https://esm.sh/@supabase/supabase-js@2');
    sb = m.createClient(CLOUD.url, CLOUD.key, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
    });
    syncState = 'ready';
    const { data } = await sb.auth.getSession();
    if (data && data.session) await onSignedIn(data.session.user);
    sb.auth.onAuthStateChange(async (ev, session) => {
      if (ev === 'SIGNED_IN' && session && (!me || me.id !== session.user.id)) await onSignedIn(session.user);
      if (ev === 'SIGNED_OUT'){ me = null; myProfile = null; friends = []; render(); }
    });
  }catch(e){
    /* 오프라인이거나 설정이 잘못돼도 앱은 그대로 동작해야 한다 */
    syncState = 'error'; sb = null;
    console.warn('클라우드 연결 실패 — 로컬 모드로 계속합니다', e);
  }
  render();
}

async function verifyLink(){
  const el = $('#linkIn'); if (!el) return;
  const raw = (el.value || '').trim();
  const msg = $('#linkMsg'), btn = $('#linkBtn');
  const fail = t => {
    if (msg){ msg.textContent = t; msg.style.color = 'var(--warn)'; }
    if (btn){ btn.disabled = false; btn.textContent = '로그인'; }
  };
  if (raw.length < 10){ fail('링크를 붙여넣어 주세요.'); return; }
  if (btn){ btn.disabled = true; btn.textContent = '확인 중…'; }
  if (msg) msg.textContent = '';

  try{
    /* 경우 1 — 이미 로그인된 주소를 붙여넣은 경우 (#access_token=...) */
    const hashPart = raw.split('#')[1];
    if (hashPart && hashPart.includes('access_token')){
      const hp = new URLSearchParams(hashPart);
      const { error } = await sb.auth.setSession({
        access_token: hp.get('access_token'),
        refresh_token: hp.get('refresh_token')
      });
      if (error) throw error;
      closeSheet(); toast('로그인했어요'); return;
    }

    /* 경우 2 — 메일의 확인 링크 (…/verify?token=…&type=…) */
    let token = null, type = 'email';
    try{
      const u = new URL(raw);
      token = u.searchParams.get('token') || u.searchParams.get('token_hash');
      type  = u.searchParams.get('type') || 'email';
    }catch(e){
      const m = raw.match(/token(?:_hash)?=([^&\s]+)/);
      if (m) token = m[1];
      const t = raw.match(/type=([^&\s]+)/);
      if (t) type = t[1];
    }
    /* 경우 3 — 토큰만 붙여넣은 경우 */
    if (!token && /^[A-Za-z0-9_\-\.]{6,}$/.test(raw)) token = raw;
    if (!token){ fail('링크에서 인증 정보를 찾지 못했어요. 메일의 링크를 통째로 복사해주세요.'); return; }

    const { error } = await sb.auth.verifyOtp({ token_hash: token, type });
    if (error) throw error;
    closeSheet(); toast('로그인했어요');
  }catch(e){
    const m = String((e && e.message) || '');
    if (m.includes('expired') || m.includes('invalid'))
      fail('링크가 만료됐거나 이미 사용됐어요. 메일을 새로 받아 가장 마지막 링크를 쓰세요.');
    else fail('로그인하지 못했어요. ' + m);
  }
}

/* ── 동기화 ──
   기록은 id로 합칩니다. 지운 것은 tomb(묘비)에 남겨서
   다른 기기에서 되살아나지 않게 합니다. */
function byId(arr){ const m = {}; (arr||[]).forEach(x => { if (x && x.id) m[x.id] = x; }); return m; }

function mergeData(local, remote){
  if (!remote) return local;
  const tomb = Object.assign({}, remote.tomb || {}, local.tomb || {});
  const union = (a, b) => Object.values(Object.assign(byId(a), byId(b))).filter(x => !tomb[x.id]);
  const uniqBy = (a, b, k) => {
    const m = {};
    (a||[]).concat(b||[]).forEach(x => { if (x && x[k] != null) m[x[k]] = x; });
    return Object.values(m);
  };
  const localNewer = (local.updatedAt || 0) >= (remote.updatedAt || 0);
  const pick = (l, r) => localNewer ? (l !== undefined && l !== null ? l : r) : (r !== undefined && r !== null ? r : l);

  return Object.assign({}, BLANK, {
    slots:      union(remote.slots, local.slots),
    sets:       union(remote.sets, local.sets),
    meals:      union(remote.meals, local.meals),
    routines:   union(remote.routines, local.routines),
    weights:    uniqBy(remote.weights, local.weights, 'date'),
    customEx:   uniqBy(remote.customEx, local.customEx, 'name'),
    customFood: uniqBy(remote.customFood, local.customFood, 'name'),
    restPref:   Object.assign({}, remote.restPref || {}, local.restPref || {}),
    tomb,
    profile:    pick(local.profile, remote.profile),
    seenStage:  Math.max(local.seenStage || 0, remote.seenStage || 0),
    lastReport: pick(local.lastReport, remote.lastReport),
    updatedAt:  Math.max(local.updatedAt || 0, remote.updatedAt || 0)
  });
}

async function pullMerge(){
  if (!sb || !me) return;
  syncState = 'syncing'; render();
  try{
    const { data, error } = await sb.from('vaults')
      .select('payload').eq('user_id', me.id).maybeSingle();
    if (error) throw error;
    const before = D.slots.length + D.sets.length + D.meals.length;
    D = mergeData(D, data ? data.payload : null);
    rebuildIndex();
    await saveData();
    const after = D.slots.length + D.sets.length + D.meals.length;
    syncState = 'done';
    if (after > before) toast('클라우드에서 기록을 가져왔어요');
  }catch(e){ syncState = 'error'; console.warn('내려받기 실패', e); }
  await pushVault();
}

async function pushVault(){

/* ── 공개 프로필 ── */
function publicStats(){
  const share = (myProfile && myProfile.share) || { big3:true, weekly:true, detail:false };
  const st = catStats();
  const out = { updated: today() };

  if (share.big3){
    const L = [['백스쿼트','squat'],['벤치프레스','bench'],['데드리프트','dead']];
    let total = 0;
    L.forEach(([k, key]) => {
      let e = 0, w = 0;
      D.slots.filter(s => s.exId === k).forEach(sl => setsOf(sl.id).forEach(s => {
        if (s.w > w) w = s.w;
        const v = setE1(s); if (v > e) e = v;
      }));
      out[key] = Math.round(e); out[key+'W'] = w; total += Math.round(e);
    });
    out.big3 = total;
    if (D.profile && D.profile.kg){
      const p = D.profile;
      const K = p.sex === 'f'
        ? [-57.96288,13.6175032,-0.1126655495,0.0005158568,-0.0000010706]
        : [-307.75076,24.0900756,-0.1918759221,0.0007391293,-0.000001093];
      const bw = Math.min(Math.max(p.kg,40),210);
      const den = K[0]+K[1]*bw+K[2]*bw**2+K[3]*bw**3+K[4]*bw**4;
      if (den > 0 && total > 0) out.dots = Math.round(total*500/den);
    }
  }
  if (share.weekly){
    out.wDays = Object.keys(st.day).filter(d => d > shift(today(),-7) && st.day[d].sets > 0).length;
    out.wVol = Math.round(st.volNow);
    out.streak = st.streak;
  }
  if (share.detail){
    const best = {};
    D.slots.forEach(sl => setsOf(sl.id).forEach(s => {
      if (!s.w) return;
      if (!best[sl.exId] || s.w > best[sl.exId]) best[sl.exId] = s.w;
    }));
    out.top = Object.keys(best).sort((a,b) => best[b]-best[a]).slice(0,8)
      .map(k => ({ n:k, w:best[k] }));
  }
  return out;
}

  const st = { off:'', ready:'대기 중', syncing:'동기화 중…', done:'동기화 완료', error:'연결 안 됨' }[syncState];
  const pend = friends.filter(f => f.status === 'pending' && f.requester !== me.id).length;
  return '<div class="sec">계정</div><div class="card">' +
    '<div class="acct"><div class="acct-t"><b>'+esc(myProfile ? myProfile.nickname : '…')+'</b>' +
      '<span>친구 코드 '+(myProfile ? myProfile.code : '—')+' · '+st+'</span></div>' +
      '<button class="tmr-b" onclick="openAccount()">관리</button></div>' +
    '<div class="row2" style="margin-top:11px">' +
      '<button class="btn btn-g btn-sm" onclick="openFriends()">친구'+(pend?' ('+pend+')':'')+'</button>' +
      '<button class="btn btn-g btn-sm" onclick="pullMerge().then(()=>toast(\'동기화했어요\'))">지금 동기화</button>' +
    '</div></div>';
}

function openLogin(){
  let h = '<div class="note" style="margin:0 0 16px">한 번 로그인해두면 이 기기에서는 계속 유지됩니다.</div>';
  h += '<button class="btn sso g" onclick="signIn(\'google\')">' +
    '<span class="sso-i">G</span>구글로 계속하기</button>';
  h += '<button class="btn sso k" onclick="signIn(\'kakao\')">' +
    '<span class="sso-i">K</span>카카오로 계속하기</button>';
  h += '<div class="or"><i></i><span>또는</span><i></i></div>';
  h += '<div class="pf"><div class="pf-w"><label>이메일</label>' +
    '<input id="loginEmail" type="email" inputmode="email" placeholder="me@example.com"></div></div>';
  h += '<button class="btn btn-g" id="emailBtn" onclick="signInEmail()">인증 코드 받기</button>';
  h += '<div class="note">비밀번호는 없습니다. 메일로 오는 <b>6자리 숫자</b>를 입력하면 로그인돼요.<br><br>' +
    '지금 이 기기에 있는 기록은 로그인하는 순간 <b>클라우드로 올라가고, 사라지지 않습니다.</b></div>';
  openSheet('로그인', h);
}

function openAccount(){
  let h = '<div class="acctbig"><div class="acctbig-c">'+catSVG(catStats().idx,'happy')+'</div>' +
    '<div class="acctbig-t"><b>'+esc(myProfile ? myProfile.nickname : '')+'</b>' +
    '<span>'+esc(me.email || '소셜 로그인')+'</span></div></div>';
  h += '<button class="btn btn-g btn-sm" onclick="openNickSetup()">닉네임 바꾸기</button>';
  h += '<div class="grp" style="margin-top:20px">내 친구 코드</div>' +
    '<div class="codebox"><b>'+(myProfile ? myProfile.code : '—')+'</b>' +
    '<button class="tmr-b" onclick="copyCode()">복사</button></div>' +
    '<div class="note">친구에게 이 코드를 알려주면 서로 추가할 수 있어요.</div>';
  h += '<div class="grp" style="margin-top:20px">계정</div>' +
    '<button class="btn btn-g btn-sm" onclick="openShare()">친구에게 공개할 항목</button>' +
    '<button class="btn btn-g btn-sm" style="margin-top:8px;color:var(--chest)" onclick="signOut()">로그아웃</button>';
  openSheet('계정 관리', h);
}

function copyCode(){
  const c = myProfile ? myProfile.code : '';
  try{ navigator.clipboard.writeText(c); toast('코드를 복사했어요'); }
  catch(e){ toast(c); }
}

function openShare(){
  const share = Object.assign({ big3:true, weekly:true, detail:false }, (myProfile && myProfile.share) || {});
  const row = (k, title, desc) =>
    '<button class="shrow" onclick="toggleShare(\''+k+'\')">' +
    '<span class="shbox'+(share[k]?' on':'')+'">'+(share[k]?'✓':'')+'</span>' +
    '<span class="shtx"><b>'+title+'</b><span>'+desc+'</span></span></button>';
  const srch = !myProfile || myProfile.searchable !== false;
  let h = '<button class="shrow" onclick="toggleSearchable()">' +
    '<span class="shbox'+(srch?' on':'')+'">'+(srch?'✓':'')+'</span>' +
    '<span class="shtx"><b>닉네임 검색 허용</b><span>다른 사람이 내 닉네임으로 나를 찾을 수 있어요</span></span></button>';
  h += row('big3','3대 기록 · 헬냥이 레벨','스쿼트·벤치·데드 추정 1RM과 DOTS 점수') +
       row('weekly','주간 활동','이번 주 운동 일수, 총 볼륨, 연속 일수') +
       row('detail','종목별 최고 기록','상위 8개 종목의 최고 중량');
  h += '<div class="note" style="margin-top:16px"><b>식단과 체중은 어떤 설정에서도 친구에게 공개되지 않습니다.</b><br>' +
    '아예 다른 표에 저장되어 있어서, 친구 계정으로는 접근 자체가 불가능합니다.<br><br>' +
    '끄면 그 항목은 서버에서도 즉시 지워집니다.</div>';
  openSheet('공개 항목', h);
}

function openFriends(){
  fSearch = { q:'', hits:[], busy:false };
  openSheet('친구', friendBodyHTML());
}
function paintFriendBody(){
  const b = $('#shB'); if (!b) return;
  const pos = b.scrollTop;
  b.innerHTML = friendBodyHTML();
  const i = $('#fq');
  if (i && fSearch.q){ i.focus(); i.setSelectionRange(fSearch.q.length, fSearch.q.length); }
  b.scrollTop = pos;
}

function friendBodyHTML(){
  const pend = friends.filter(f => f.status === 'pending' && f.requester !== me.id);
  const sent = friends.filter(f => f.status === 'pending' && f.requester === me.id);
  const ok   = friends.filter(f => f.status === 'accepted');

  let h = '<input class="search" id="fq" placeholder="닉네임으로 친구 찾기" value="'+esc(fSearch.q)+
          '" oninput="onSearchInput(this.value)">';

  /* 검색 결과 */
  if (fSearch.q.trim()){
    if (fSearch.busy){
      h += '<div class="empty" style="padding:20px">찾는 중…</div>';
    } else if (!fSearch.hits.length){
      h += '<div class="empty" style="padding:20px">그런 닉네임이 없어요.<br>' +
           '<span style="font-size:11px">상대가 검색 노출을 꺼뒀을 수도 있어요.</span></div>';
    } else {
      h += '<div class="grp">검색 결과 '+fSearch.hits.length+'</div>';
      fSearch.hits.forEach(u => { h += userRow(u, u.rel); });
    }
    h += '<div class="hint">코드로 추가하려면 검색창을 비우세요.</div>';
    return h;
  }

  /* 받은 요청 */
  if (pend.length){
    h += '<div class="grp">받은 요청 '+pend.length+'</div>';
    pend.forEach(f => {
      h += '<div class="frow"><span class="fcat">'+catSVG(f.stage||0,'happy')+'</span>' +
        '<span class="fmid"><b>'+esc(f.nickname)+'</b><span>친구 요청을 보냈어요</span></span>' +
        '<button class="rt-b" onclick="acceptFriend(\''+f.fid+'\')">수락</button>' +
        '<button class="rt-x" onclick="removeFriend(\''+f.fid+'\',\''+q(f.nickname)+'\')">✕</button></div>';
    });
  }

  /* 추천 친구 */
  if (suggests.length){
    h += '<div class="grp">알 수도 있는 사람</div>';
    suggests.forEach(u => {
      const via = (u.via_names || []).slice(0,2).join(', ');
      const more = (u.via_names || []).length > 2 ? ' 외 '+((u.via_names.length)-2)+'명' : '';
      h += '<div class="frow"><span class="fcat">'+catSVG(u.stage||0,'normal')+'</span>' +
        '<span class="fmid"><b>'+esc(u.nickname)+'</b>' +
        '<span class="mutual">함께 아는 친구 <b style="color:var(--tx)">'+u.mutual+'명</b>'+(via?' · '+esc(via)+more:'')+'</span></span>' +
        '<button class="rt-b" onclick="sendRequest(\''+u.uid+'\',\''+q(u.nickname)+'\')">추가</button></div>';
    });
  }

  /* 보낸 요청 */
  if (sent.length){
    h += '<div class="grp">보낸 요청 '+sent.length+'</div>';
    sent.forEach(f => {
      h += '<div class="frow"><span class="fcat">'+catSVG(f.stage||0,'normal')+'</span>' +
        '<span class="fmid"><b>'+esc(f.nickname)+'</b><span>수락 대기 중</span></span>' +
        '<button class="rt-x" onclick="removeFriend(\''+f.fid+'\',\''+q(f.nickname)+'\')">✕</button></div>';
    });
  }

  /* 친구 랭킹 */
  h += '<div class="grp">친구 '+ok.length+'</div>';
  if (!ok.length){
    h += '<div class="empty">아직 친구가 없습니다.<br>위에서 닉네임으로 찾아보세요.</div>';
  } else {
    const mine = publicStats();
    const rows = ok.map(f => ({ me:false, name:f.nickname, stage:f.stage, s:f.stats||{}, fid:f.fid }));
    rows.push({ me:true, name:(myProfile?myProfile.nickname:'나'), stage:catStats().idx, s:mine });
    rows.sort((a,b) => (b.s.big3||0) - (a.s.big3||0));
    rows.forEach((r,i) => {
      const s2 = r.s, bits = [];
      if (s2.big3) bits.push('3대 '+s2.big3);
      if (s2.dots) bits.push('DOTS '+s2.dots);
      if (s2.wDays !== undefined) bits.push('이번주 '+s2.wDays+'일');
      if (s2.wVol) bits.push(Math.round(s2.wVol/100)/10+'t');
      h += '<div class="frow'+(r.me?' mine':'')+'">' +
        '<span class="frank'+(i<3?' top':'')+'">'+(i+1)+'</span>' +
        '<span class="fcat">'+catSVG(r.stage||0,'happy')+'</span>' +
        '<span class="fmid"><b>'+esc(r.name)+(r.me?' <em class="tagme">나</em>':'')+'</b>' +
        '<span>'+(bits.join(' · ') || '공개 항목 없음')+'</span></span>' +
        (r.me?'':'<button class="rt-x" onclick="removeFriend(\''+r.fid+'\',\''+q(r.name)+'\')">✕</button>') +
        '</div>';
      if (!r.me && s2.top && s2.top.length){
        h += '<div class="ftop">'+s2.top.slice(0,4).map(t => '<i>'+esc(t.n)+' '+t.w+'</i>').join('')+'</div>';
      }
    });
  }

  /* 코드로 추가 (보조) */
  h += '<div class="grp" style="margin-top:20px">코드로 추가</div>' +
    '<div class="pf"><div class="pf-w">' +
    '<input id="codeIn" maxlength="8" placeholder="예: A3F91C" style="text-transform:uppercase"></div></div>' +
    '<button class="btn btn-g btn-sm" onclick="addFriend()">코드로 요청 보내기</button>' +
    '<div class="hint">내 코드 <b>'+(myProfile?myProfile.code:'—')+'</b> · 검색에 안 뜨고 싶을 때 쓰는 방법이에요.</div>';
  return h;
}

function userRow(u, rel){
  const label = { accepted:'이미 친구', pending:'대기 중' }[rel];
  return '<div class="frow"><span class="fcat">'+catSVG(u.stage||0,'normal')+'</span>' +
    '<span class="fmid"><b>'+esc(u.nickname)+'</b>' +
    '<span'+(u.mutual?' class="mutual"':'')+'>' +
      (u.mutual ? '함께 아는 친구 '+u.mutual+'명' : STAGES[Math.min(u.stage||0,5)].name) + '</span></span>' +
    (label ? '<span class="reltag">'+label+'</span>'
           : '<button class="rt-b" onclick="sendRequest(\''+u.uid+'\',\''+q(u.nickname)+'\')">추가</button>') +
    '</div>';
}

Object.assign(window, {
  signIn, signInEmail, signOut, openLogin, openAccount, openShare, openFriends,
  saveNickname, copyCode, toggleShare, addFriend, acceptFriend, removeFriend, verifyCode, verifyLink, showPasteStep, showCodeStep, loginErrHTML,
  pullMerge, pushVault, initCloud, openNickSetup, toggleSearchable, onSearchInput,
  sendRequest, paintFriendBody
});


/* 시작 */
(async function(){
  D = await loadData();
  rebuildIndex();
  viewDate = today();
  recAnchor = today();
  render();
  initCloud();
})();
</script>
